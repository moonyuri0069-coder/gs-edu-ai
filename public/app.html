<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS더프레시 AI 교육만족도 분석 시스템</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

/* ═══════════ 디자인 토큰 ═══════════ */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --surface2:#f0f2ef; --border:#e4e7e2;
  --ink:#141714; --ink2:#454b46; --ink3:#79807a; --ink4:#a4aaa4;
  --green:#0e5a34; --green-b:#16a34a; --green-soft:#e8f3ec; --green-line:#bfdccb;
  --amber:#b45309; --amber-soft:#fbf0df; --red:#b4433a; --red-soft:#f9e9e7;
  --shadow:0 1px 2px rgba(20,23,20,.05),0 4px 14px rgba(20,23,20,.05);
  --r:12px; --r-sm:8px;
  --star:#f2b01e; --star-off:#d8dcd7;
}
html[data-theme="dark"]{
  --bg:#131513; --surface:#1b1e1b; --surface2:#232723; --border:#2e332e;
  --ink:#eef1ee; --ink2:#c2c8c2; --ink3:#8b928b; --ink4:#5f665f;
  --green:#4cc07a; --green-b:#3db56c; --green-soft:#1c2b21; --green-line:#2c4534;
  --amber:#e0a04a; --amber-soft:#2e2517; --red:#e07a70; --red-soft:#301d1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --star:#e8b23c; --star-off:#3a403a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ═══════════ 레이아웃 셸 ═══════════ */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.logo{padding:22px 20px 16px;border-bottom:1px solid var(--border)}
.logo-main{font-size:1.06rem;font-weight:800;color:var(--green);letter-spacing:.02em}
.logo-sub{font-size:.72rem;color:var(--ink3);margin-top:2px;font-weight:600}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);
  color:var(--ink2);font-size:.93rem;font-weight:500;cursor:pointer;border-left:3px solid transparent;
}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--green-soft);color:var(--green);border-left-color:var(--green-b);font-weight:700}
.nav-item svg{width:17px;height:17px;flex:0 0 auto}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);font-size:.78rem;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:60px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:20;
}
.page-title{font-size:1.05rem;font-weight:800}
.page-sub{font-size:.8rem;color:var(--ink3)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:24px 26px 60px;max-width:1240px;width:100%;margin:0 auto}

/* ═══════════ 공통 컴포넌트 ═══════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card-title{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
.card-sub{font-size:.8rem;color:var(--ink3);margin-top:2px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font-size:.88rem;font-weight:600;transition:background .12s;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--ink3)}
.btn.sm{padding:6px 11px;font-size:.8rem}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.gray{background:var(--surface2);color:var(--ink3)}
.input,.select,textarea.input{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);outline:none;transition:border-color .12s;
}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--green-b)}
label.fld{display:block;font-size:.8rem;font-weight:700;color:var(--ink2);margin:0 0 5px}
.fld-group{margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{
  text-align:left;font-size:.76rem;color:var(--ink3);font-weight:700;
  padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);
}
.tbl th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.tbl th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.tbl td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover td{background:var(--surface2);cursor:pointer}
.empty{padding:44px 20px;text-align:center;color:var(--ink3);font-size:.9rem}
.kpi-label{font-size:.8rem;color:var(--ink3);font-weight:700}
.kpi-value{font-size:1.9rem;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi-value small{font-size:.95rem;color:var(--ink3);font-weight:700;margin-left:2px}
.kpi-sub{font-size:.78rem;margin-top:4px;font-weight:600}
.up{color:var(--green-b)} .down{color:var(--red)} .flat{color:var(--ink3)}
.divider{height:1px;background:var(--border);margin:16px 0}
.chip{display:inline-flex;padding:5px 12px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);font-size:.8rem;font-weight:600;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;
  font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,10,.45);display:none;
  align-items:flex-start;justify-content:center;z-index:50;padding:6vh 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:560px;
  border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);font-weight:800;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.x{border:none;background:none;font-size:1.15rem;color:var(--ink3);cursor:pointer}

/* 별점 */
.stars{display:inline-flex;gap:3px}
.stars button{border:none;background:none;font-size:1.55rem;line-height:1;color:var(--star-off);padding:2px;transition:transform .08s}
.stars button.on{color:var(--star)}
.stars button:hover{transform:scale(1.12)}
.stars.ro button{cursor:default;font-size:1rem;padding:0}
.stars.ro button:hover{transform:none}
.star-val{font-weight:800;font-size:.92rem;margin-left:6px}

/* 워드클라우드 */
.cloud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:18px 8px}
.cloud span{font-weight:800;line-height:1.2}

/* AI Summary 시그니처 카드 */
.ai-card{position:relative;overflow:hidden}
.ai-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--green-b),var(--green))}
.ai-eyebrow{font-size:.78rem;font-weight:800;color:var(--green);letter-spacing:.04em}
.ai-headline{font-size:1.18rem;font-weight:800;margin:6px 0 8px;letter-spacing:-.01em}
.gauge{height:10px;border-radius:99px;background:var(--red-soft);overflow:hidden;display:flex}
.gauge>i{display:block;height:100%;background:var(--green-b);border-radius:99px 0 0 99px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* 설문(참여자) */
.survey-wrap{max-width:680px;margin:0 auto;padding:34px 18px 80px}
.survey-brand{text-align:center;margin-bottom:18px}
.survey-brand b{color:var(--green);font-size:1.05rem;font-weight:800}
.sv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:24px 26px;margin-bottom:16px}
.sv-title{font-size:1.28rem;font-weight:800;letter-spacing:-.01em}
.sv-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sv-q{font-weight:700;font-size:.95rem;margin:18px 0 8px}
.sv-q .req{color:var(--red)}
.sv-section{font-size:.8rem;font-weight:800;color:var(--green);letter-spacing:.05em;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);
  border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;font-size:.92rem}
.opt.on{border-color:var(--green-b);background:var(--green-soft);font-weight:700}
.progressbar{position:sticky;top:0;height:4px;background:var(--border);z-index:5}
.progressbar>i{display:block;height:100%;background:var(--green-b);transition:width .2s}

/* 리커트 선택 */
.likert{display:flex;gap:6px;flex-wrap:wrap}
.likert button{flex:1;min-width:90px;padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);font-size:.9rem;font-weight:700;color:var(--ink2);transition:.1s;letter-spacing:.02em}
.likert button.on{border-color:var(--green-b);background:var(--green-soft);color:var(--green);font-weight:800}
/* QR */
.qrbox{display:flex;gap:18px;align-items:center}
.qrbox canvas{border:1px solid var(--border);border-radius:var(--r-sm);background:#fff}

/* 로그인 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px}

/* 임원보고 (A4) */

@keyframes gs-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gs-wave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes gs-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
@keyframes gs-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.gs-char-bounce{animation:gs-bounce 1.5s ease-in-out infinite}
.gs-char-wave{animation:gs-wave 2s ease-in-out infinite;transform-origin:bottom center}
.gs-char-float{animation:gs-float 2.5s ease-in-out infinite}

.report-a4{background:#fff;color:#141714;width:794px;margin:0 auto;padding:24px 28px;box-sizing:border-box}
.rp-p1-title{font-size:1.3rem;font-weight:900;letter-spacing:-.02em;margin-bottom:7px}
.rp-subtitle{font-size:.82rem;color:#555;margin-bottom:10px;line-height:1.5}
.rp-two-top{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;margin-bottom:8px}
.rp-section-box{border:1.5px solid #cdd8cb;border-radius:6px;padding:7px 10px}
.rp-section-head{font-size:.7rem;font-weight:800;color:#0e5a34;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.rp-section-body{font-size:.78rem;color:#333;line-height:1.5}
.rp-att{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:4px}
.rp-att th{background:#0e5a34;color:#fff;padding:3px 6px;text-align:center;font-weight:700}
.rp-att td{padding:3px 6px;border:1px solid #e4e7e2;text-align:center}
.rp-sched{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:4px}
.rp-sched th{background:#0e5a34;color:#fff;padding:3px 6px;text-align:center;font-weight:700}
.rp-sched td{padding:3px 6px;border:1px solid #e4e7e2;text-align:center;font-size:.78rem}
.rp-photos-full{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.rp-photo-ph-sm{background:#f0f4f1;border-radius:8px;aspect-ratio:4/3;min-height:120px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;position:relative;overflow:hidden}
.rp-kpi-row{display:flex;gap:6px;margin:8px 0}
.rp-kpi-badge{flex:1;border:1.5px solid #cdd8cb;border-radius:6px;padding:6px 4px;text-align:center;background:#f9fbf9}
.rp-kpi-badge .k-val{font-size:1.05rem;font-weight:900;color:#0e5a34}
.rp-kpi-badge .k-lbl{font-size:.62rem;color:#666;margin-top:2px}
.rp-page-break{border:none;border-top:2px dashed #e4e7e2;margin:16px 0;position:relative}
.rp-page-break::after{content:'- 1/2 -';position:absolute;right:0;top:-10px;font-size:.72rem;color:#aaa;background:#fff;padding:0 6px}
.rp-two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.rp-sec{font-size:.78rem;font-weight:800;color:#0e5a34;border-bottom:1.5px solid #0e5a34;padding-bottom:3px;margin-bottom:6px}
.rp-opinion-table{width:100%;border-collapse:collapse;font-size:.72rem}
.rp-opinion-table th{background:#0e5a34;color:#fff;padding:4px 6px;font-weight:700}
.rp-opinion-table td{padding:4px 6px;border:1px solid #e4e7e2;vertical-align:top;line-height:1.4}
.rp-opinion-table td.lname{font-weight:700;color:#0e5a34;white-space:nowrap;font-size:.72rem;text-align:center}
.rp-opinion-table ul{margin:0;padding-left:14px}
.rp-opinion-table li{margin-bottom:2px}
.rp-opinion-table li.hi{color:#0e5a34;font-weight:700}
.rp-needs{font-size:.72rem;line-height:1.6;color:#333;background:#f0f4f1;border-radius:6px;padding:8px 10px;margin-top:4px}
.rp-rec-list{margin:0;padding:0;list-style:none}
.rp-rec-list li{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:.72rem}
.rec-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rec-bar-label{font-size:.72rem;color:#333;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-bar-track{flex:1;height:10px;background:#e4e7e2;border-radius:5px;overflow:hidden}
.rec-bar-num{font-size:.72rem;font-weight:700;color:#0e5a34;width:20px;text-align:right}
.rec-bar{flex:1;height:8px;background:#e4e7e2;border-radius:4px;overflow:hidden}
.rec-bar-fill{height:100%;background:#0e5a34;border-radius:4px}
.rec-bar-fill.best{background:#e85d8a}
.rp-cost{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:6px}
.rp-cost th{background:#0e5a34;color:#fff;padding:4px 6px;text-align:center}
.rp-cost td{padding:4px 6px;border:1px solid #e4e7e2;text-align:center}
.rp-ai-box{background:#f0f4f1;border-radius:6px;padding:8px 10px;font-size:.72rem;line-height:1.7;color:#333;white-space:pre-wrap;overflow:visible;max-height:none;height:auto}
.rp-p2-title{font-size:1.05rem;font-weight:900;margin-bottom:8px;letter-spacing:-.01em;border-bottom:2.5px solid #0e5a34;padding-bottom:6px}
.rp-page-end{font-size:.65rem;color:#aaa;text-align:right;margin-top:8px}
.ag-info-item{background:#f0f4f1;border-radius:6px;padding:7px 10px;text-align:center}
.ag-att{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:4px}
.ag-att th{background:#0e5a34;color:#fff;padding:4px 8px;text-align:center;font-weight:700}
.ag-att td{padding:4px 8px;border:1px solid #e4e7e2;text-align:center}
.editable-opinion{min-height:1em;display:inline}
.agenda-a4{
  background:#fff;color:#141714;width:794px;margin:0 auto;
  padding:32px 36px 40px;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:4px;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
.ag-title{font-size:1.25rem;font-weight:900;letter-spacing:-.02em;text-align:center;
  padding:10px 0 8px;border-bottom:2.5px solid #0e5a34;margin-bottom:10px;color:#0e5a34}
.ag-head{font-size:.84rem;background:#f0f4f1;border-left:4px solid #0e5a34;
  padding:7px 14px;margin-bottom:14px;color:#1a2e1a;font-weight:600;line-height:1.5;border-radius:0 4px 4px 0}
.ag-info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ag-info-box{border:1.5px solid #cdd8cb;border-radius:6px;overflow:hidden}
.ag-info-label{background:#0e5a34;color:#fff;font-size:.72rem;font-weight:800;
  padding:4px 10px;letter-spacing:.04em;text-align:center}
.ag-info-val{padding:7px 10px;font-size:.82rem;font-weight:700;text-align:center;min-height:36px;
  display:flex;align-items:center;justify-content:center}
.ag-section-title{font-size:.82rem;font-weight:900;color:#0e5a34;
  border-bottom:1.5px solid #0e5a34;padding-bottom:4px;margin-bottom:8px;letter-spacing:.03em}
.ag-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:6px}
.ag-table th{background:#0e5a34;color:#fff;padding:5px 10px;font-weight:800;text-align:center!important}
.ag-table td{padding:5px 10px;border:1px solid #e4e7e2;line-height:1.4;text-align:center}
.ag-table tr:nth-child(even) td{background:#f8faf7}
.ag-footer{margin-top:16px;text-align:right;font-size:.72rem;color:#aaa;border-top:1px solid #eee;padding-top:8px}
@media print{
  .print-agenda .side,.print-agenda .topbar,.print-agenda .card,.print-agenda .content>*:not(#agendaDoc){display:none!important}
  .print-agenda #agendaDoc{display:block!important;width:100%;box-shadow:none}
  .print-report .side,.print-report .topbar,.print-report .card,.print-report .content>*:not(#reportA4){display:none!important}
  .print-report #reportA4{display:block!important;width:100%;box-shadow:none}
  .no-print{display:none!important}
  .no-print-border{border-bottom:none!important;cursor:default!important}
}

@media (max-width:620px){
  .g4,.g3,.g2,.rp-two{grid-template-columns:1fr}
  .rp-two-top{grid-template-columns:1fr}
  .dash-kpi{grid-template-columns:repeat(2,1fr)}
  .nav-label{display:none}
  .content{padding:18px 14px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 교육생안내 미리보기 폰트 축소 */
#slideScale *{font-size:100%!important}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>


<script>
/* ═══════════ 데이터 계층 ═══════════ */
const LS_KEY='gs_edu_ai_v2';
const TYPES=['OFC','개점지원담당','인턴사원','점포영업담당','부점장','점장','개발담당','기타'];

let DB={trainings:[],instructors:[],responses:[],ai:{},theme:'light'};
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      DB=JSON.parse(raw);
      // 시드 데이터(t1~t6) 제거
      DB.trainings=DB.trainings.filter(t=>!t.id.match(/^t[1-6]$/));
      DB.responses=DB.responses.filter(r=>!r.trainingId.match(/^t[1-6]$/));
    }else{
      DB={trainings:[],instructors:[],responses:[],ai:{},theme:'light'};
    }
  }catch(e){
    DB={trainings:[],instructors:[],responses:[],ai:{},theme:'light'};
  }
  DB.deletedResponseIds=DB.deletedResponseIds||[]; // 관리자가 삭제한 응답 id (서버 삭제가 막혀 있어도 새로고침 시 되살아나지 않도록)
  DB.testRecords=DB.testRecords||[]; // 테스트 이력관리 (직책별 테스트 합격/점수)
  DB.deletedTestRecordIds=DB.deletedTestRecordIds||[]; // 삭제한 테스트 이력 id (서버 삭제 실패 시 재등장 방지)
  DB.testHiddenCols=DB.testHiddenCols||{}; // 직책별로 숨긴 테스트 이력관리 고정 열
  DB.linkTabs=DB.linkTabs||[{id:'default',name:'기본',links:[]}]; // 링크관리 — 탭별 공유 링크 모음
  if(!DB.linkTabs.length)DB.linkTabs=[{id:'default',name:'기본',links:[]}];
  DB.deletedLinkTabIds=DB.deletedLinkTabIds||[]; // 삭제한 링크 탭 id (서버 삭제 실패 시 재등장 방지)
  DB.formLinks=DB.formLinks||[]; // 테스트별 구글폼(구글시트 CSV) 연동 설정
  save();
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const pct=n=>Math.round(n)+'%';
const byId=(arr,id)=>arr.find(x=>x.id===id);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function respOf(tid){return DB.responses.filter(r=>r.trainingId===tid);}
function lectOf(t,lid){return t.lectures.find(l=>l.id===lid);}
function lectLabel(t,L){const ins=byId(DB.instructors,L.instructorId);const nm=ins?ins.name:(L.instructorName||'');return nm?`${L.title} - ${nm}`:L.title;}
// 설문 포함 여부: '설문제외' 체크박스(isTest)를 체크한 과목만 설문에서 빠짐 — 그 외 자동/키워드 판별 없음
function lectSurveyOn(L){return !L.isTest;}
// 설문 대상 후보 강의: 첫/마지막(개회·수료)·점심식사·가치공유 제외 + 동일강사 중복 제거 (설문 on/off와 무관하게 전체 후보를 반환)
function survCandidates(t){
  // 자동 제외 없음 — 첫/마지막, 점심식사/가치공유, 동일강사 등 어떤 조건도 자동으로 걸러내지 않음.
  // 오직 각 강의의 '설문제외' 체크박스(isTest)만으로 설문 포함 여부가 결정됨 (surveyLectures 참고).
  return t.lectures.slice();
}
// 실제 설문에 노출될 문항: 후보 중 설문 on 인 것 + 관리자가 추가한 커스텀 문항
function surveyLectures(t){
  const extra=(t.surveyExtra||[]).map(e=>({id:e.id,title:e.title,instructorId:'',instructorName:'',field:'',isExtra:true}));
  return survCandidates(t).filter(lectSurveyOn).concat(extra);
}
// 설문제외 체크박스 토글 (실제 교육일정에는 영향 없음, 설문에서만 빠짐)
function toggleSurveyLect(tid,lid){
  const t=byId(DB.trainings,tid);if(!t)return;
  const L=lectOf(t,lid);if(!L)return;
  L.isTest=!L.isTest;
  save();sbUpsert('trainings',{id:tid,lectures:t.lectures});
  toast(L.isTest?'설문에서 제외했습니다':'설문에 포함했습니다');
  rerender();
}
function addSurveyExtra(tid){
  const t=byId(DB.trainings,tid);if(!t)return;
  t.surveyExtra=t.surveyExtra||[];
  const item={id:'ex'+Date.now(),title:'새 설문 문항'};
  t.surveyExtra.push(item);
  save();sbUpsert('trainings',{id:tid,survey_extra:t.surveyExtra});
  rerender();
  setTimeout(()=>{const el=document.getElementById('sx_'+item.id);if(el){el.focus();el.select();}},30);
}
function updateSurveyExtraTitle(tid,eid,val){
  const t=byId(DB.trainings,tid);if(!t)return;
  const e=(t.surveyExtra||[]).find(x=>x.id===eid);if(!e)return;
  e.title=val.trim()||'새 설문 문항';
  save();sbUpsert('trainings',{id:tid,survey_extra:t.surveyExtra});
}

function respAvg(r){return avg(Object.values(r.lect).flatMap(v=>[toScore(v.expert),toScore(v.practical)]));}
function trainingAvg(tid){const rs=respOf(tid);return rs.length?avg(rs.map(respAvg)):0;}
function trainingRate(t){const n=respOf(t.id).length;return t.invited?Math.min(100,n/t.invited*100):0;}
function lectureAvg(tid,lid){const vs=respOf(tid).map(r=>r.lect[lid]).filter(Boolean);
  return {expert:avg(vs.map(v=>toScore(v.expert))),practical:avg(vs.map(v=>toScore(v.practical))),
    total:avg(vs.flatMap(v=>[toScore(v.expert),toScore(v.practical)])),n:vs.length};}
function instructorStat(iid,fromD,toD){
  let ex=[],pr=[],n=0;const perT={};
  // 같은 날짜 강의는 1회로 카운트 (중복 제거)
  const countedDates=new Set();
  DB.trainings.forEach(t=>{
    if(fromD&&t.date<fromD)return;
    if(toD&&t.date>toD)return;
    // 첫번째/마지막 강의 제외한 실제 강의 목록
    const evalLects=t.lectures.filter((_,i,arr)=>i>0&&i<arr.length-1);
    const hasLect=evalLects.some(L=>L.instructorId===iid);
    if(!hasLect)return;
    if(!countedDates.has(t.date)){countedDates.add(t.date);n++;}
    evalLects.forEach(L=>{if(L.instructorId!==iid)return;
      respOf(t.id).forEach(r=>{const v=r.lect[L.id];if(!v)return;ex.push(toScore(v.expert));pr.push(toScore(v.practical));
        (perT[t.id]=perT[t.id]||[]).push((v.expert+v.practical)/2);});});});
  const ins=byId(DB.instructors,iid);
  const finalN=(ins&&ins.manualCount!==undefined)?ins.manualCount:n;
  return {n:finalN,expert:avg(ex),practical:avg(pr),avg:avg([...ex,...pr]),perT};
}

const KW_POS=[['디테일한 설명',/디테일|자세|세세/],['쉬운 전달',/쉽|이해하기|간략|간결/],['실무 적용성',/실무|현장|점포에 적용|바로 쓸/],
 ['사례·예시',/사례|예시/],['질의응답',/질문|답변|들어주/],['방향성 공유',/방향|계획|전략.*공유|흐름/],['전문성',/전문성|노하우/],['새로운 지식',/몰랐|새로운|알게|배움|배웠/]];
const KW_IMP=[['교육시간 확대',/시간(이|을)?.*(짧|부족)|깊이가 (얕|얇)/],['질의응답 시간',/질문.*시간|질의응답.*부족/],
 ['진행 속도 조절',/속도/],['실습 확대',/실습/],['사전 자료 공유',/미리 공유|사전/],['교육 깊이 강화',/깊이/]];
function analyze(tid){
  const rs=respOf(tid);if(!rs.length)return null;
  const t=byId(DB.trainings,tid);
  const goods=[],imps=[],etcs=[];
  rs.forEach(r=>{Object.values(r.lect).forEach(v=>{
    if(v.good&&!/^없|^무$|^특이|^\.$|^\s*$/.test(v.good))goods.push(v.good);
    if(v.improve&&!/^없|^무$|^특이|^\.$|^\s*$/.test(v.improve))imps.push(v.improve);});
    if(r.etc&&!/^없/.test(r.etc))etcs.push(r.etc);if(r.need&&!/^없/.test(r.need))etcs.push(r.need);});
  const count=(pool,dict)=>{const m={};pool.forEach(s=>dict.forEach(([k,re])=>{if(re.test(s))m[k]=(m[k]||0)+1;}));
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const topPos=count(goods,KW_POS).slice(0,5),topImp=count(imps,KW_IMP).slice(0,5);
  const nOp=goods.length+imps.length+etcs.length;
  const posRate=nOp?(goods.length+etcs.filter(s=>/감사|만족|기대|좋/.test(s)).length)/nOp*100:0;
  // 추천 강의 집계
  const recCnt={};rs.forEach(r=>{if(r.recommendLecture)recCnt[r.recommendLecture]=(recCnt[r.recommendLecture]||0)+1;});
  const recTop=Object.entries(recCnt).sort((a,b)=>b[1]-a[1]);
  const bestL=recTop[0]?lectOf(t,recTop[0][0]):null;
  const kw=[...topPos.map(([k,c])=>({k,c,pos:1})),...topImp.map(([k,c])=>({k,c,pos:0}))].sort((a,b)=>b.c-a.c);
  const p1=topPos[0]?.[0]||'강의 내용',p2=topPos[1]?.[0]||'강사 전문성';
  const i1=topImp[0]?.[0]||'교육시간 확대';
  const summary=`이번 「${t.name} ${t.round}차」는 ${p1}, ${p2} 항목에서 높은 평가를 받았습니다(강의 평균 ${f1(trainingAvg(tid))}점).`
   +(bestL?` 추천 강의 1위는 「${bestL.title}」(${recTop[0][1]}표)입니다.`:'')
   +(topImp.length?` 반면 ${i1}에 대한 의견이 확인되어 과정 설계 시 보완이 필요합니다.`:' 개선 의견은 특이사항이 없습니다.')
   +` 전체 의견 ${nOp}건 중 긍정 비율은 ${pct(posRate)}입니다.`;
  const plan=`${p1} 중심의 강의 구성은 높은 만족도를 보였습니다. `
   +(topImp.length?`다만 ${topImp.map(x=>x[0]).slice(0,2).join('과 ')} 요구가 반복되어, 향후 차수에서는 강의당 시간을 확대하고 질의응답 세션을 별도 편성하는 것을 권장합니다.`
   :'현행 구성을 유지하되 추천 상위 강의를 차기 과정의 핵심 트랙으로 확대 편성하는 것을 권장합니다.');
  const res={topPos,topImp,keywords:kw,posRate,negRate:100-posRate,nOpinions:nOp,summary,plan,
    recTop,goods:goods.slice(0,60),imps:imps.slice(0,60),analyzedAt:new Date().toISOString()};
  DB.ai[tid]=res;save();return res;
}

function chLine(labels,vals,{w=520,h=200,min=1,max=5,color='var(--green-b)'}={}){
  const px=44,py=18,gw=w-px-14,gh=h-py-34,n=vals.length;
  const X=i=>px+gw*(n>1?i/(n-1):0),Y=v=>py+gh*(1-(v-min)/(max-min));
  let grid='',pts='',dots='',lbl='';
  for(let g=min;g<=max;g+=0.5){const y=Y(g);grid+=`<line x1="${px}" y1="${y}" x2="${w-10}" y2="${y}" stroke="var(--border)"/><text x="${px-8}" y="${y+4}" font-size="10" fill="var(--ink3)" text-anchor="end">${g.toFixed(1)}</text>`;}
  vals.forEach((v,i)=>{pts+=`${X(i)},${Y(v)} `;dots+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
    lbl+=`<text x="${X(i)}" y="${h-8}" font-size="10.5" fill="var(--ink3)" text-anchor="middle">${labels[i]}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">${grid}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}
function chBars(labels,vals,{w=520,h=210,max=5,color='var(--green-b)',fmt=f1}={}){
  const px=14,gh=h-52,n=vals.length,bw=Math.min(46,(w-px*2)/n*0.55);let out='';
  vals.forEach((v,i)=>{const cx=px+(w-px*2)*(i+0.5)/n,bh=gh*(v/max);
    out+=`<rect x="${cx-bw/2}" y="${18+gh-bh}" width="${bw}" height="${Math.max(2,bh)}" rx="6" fill="${color}"/>

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%"><line x1="${px}" y1="${18+gh}" x2="${w-px}" y2="${18+gh}" stroke="var(--border)"/>${out}</svg>`;
}

function drawQR(canvas,text){
  // canvas를 img 태그로 교체하여 QR 표시
  const size=canvas.width||200;
  const apiUrl='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text)+'&margin=10&format=png';
  // canvas 부모에 img 삽입
  const img=document.createElement('img');
  img.src=apiUrl;
  img.width=size;img.height=size;
  img.style.cssText='display:block;border-radius:4px';
  img.onerror=()=>{
    // API 실패 시 URL 텍스트로 대체
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#f0f4f1';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#0e5a34';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('QR 로드 실패',size/2,size/2-10);
    ctx.fillText('URL을 직접 사용하세요',size/2,size/2+10);
  };
  if(canvas.parentNode){
    canvas.style.display='none';
    // 기존 img 있으면 제거
    const old=canvas.parentNode.querySelector('img.qr-img');
    if(old)old.remove();
    img.classList.add('qr-img');
    canvas.parentNode.insertBefore(img,canvas);
  }
}
function csv(rows,name){

}

// 전역 Ctrl+V 핸들러
window.addEventListener('paste', function(e){
  const items = e.clipboardData?.items || [];
  
  // 1. 이미지 붙여넣기 → 결과보고서 사진 슬롯에 추가
  for(const item of items){
    if(item.type.startsWith('image/')){
      const modal = document.getElementById('modal');
      const isModalOpen = modal && modal.innerHTML.trim();
      if(!isModalOpen && RPQ){ // 보고서 페이지에 있을 때
        e.preventDefault();
        const file = item.getAsFile();
        if(!file) return;
        if(file.size > 3*1024*1024){ toast('3MB 이하 사진만 가능합니다'); return; }
        const reader = new FileReader();
        reader.onload = ev => {
          const t = byId(DB.trainings, RPQ);
          if(!t) return;
          if(!t.photos) t.photos = [];
          let slot = t.photos.findIndex(p => !p);
          if(slot === -1) slot = t.photos.length;
          if(slot >= 6){ toast('사진은 최대 6장까지 가능합니다'); return; }
          t.photos[slot] = ev.target.result;
          sbPatch('trainings', RPQ, {photos: t.photos});
          save(); render(); toast('📷 사진 ' + (slot+1) + ' 추가되었습니다');
        };
        reader.readAsDataURL(file);
        return;
      }
    }
  }

  // 2. 텍스트(엑셀) 붙여넣기 → 강의/참석자 입력
  const text = e.clipboardData?.getData('text');
  if(!text) return;
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if(!lines.length || !lines[0].includes('\t')) return; // 탭 없으면 엑셀 아님

  const modal = document.getElementById('modal');
  if(!modal || !modal.innerHTML.trim()) return;

  if(document.getElementById('lectList')){
    e.preventDefault();
    const start = /^[0-9:]/.test(lines[0]) ? 0 : 1;
    const added = [];
    for(let i = start; i < lines.length; i++){
      const cols = lines[i].split('\t').map(c => c.trim());
      if(cols.length >= 2 && cols[1]) added.push({slot:cols[0]||'',title:cols[1]||'',field:cols[2]||'',instructorName:cols[3]||'',instructorId:''});
    }
    if(added.length){ LECT_DRAFT=[...LECT_DRAFT,...added]; renderLectRows(); toast('강의 '+added.length+'개 붙여넣기 완료'); }
  } else if(document.getElementById('attList')){
    e.preventDefault();
    const start = /^[가-힣]/.test(lines[0].split('\t')[0]) && lines[0].split('\t').length >= 3 ? 0 : 1;
    const added = [];
    for(let i = start; i < lines.length; i++){
      const cols = lines[i].split('\t').map(c => c.trim());
      if(cols.length >= 3 && cols[2]) added.push({team:cols[0]||'',store:cols[1]||'',name:cols[2]||''});
    }
    if(added.length){ ATT_DRAFT=[...ATT_DRAFT,...added]; renderAttRows(); toast('참석자 '+added.length+'명 붙여넣기 완료'); }
  }
});

async function syncDeletedIds(){
  try{
    const rr=await fetch('https://eldpjvlefuhyfacrmwsl.supabase.co/rest/v1/deleted_ids?select=*',{
      headers:{'apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM'}
    });
    if(!rr.ok)return; // deleted_ids 테이블이 없으면 조용히 건너뜀 (아직 SQL을 실행하지 않은 경우)
    const rows=await rr.json();
    if(!rows||!rows.length)return;
    DB.deletedResponseIds=DB.deletedResponseIds||[];
    DB.deletedTestRecordIds=DB.deletedTestRecordIds||[];
    DB.deletedLinkTabIds=DB.deletedLinkTabIds||[];
    const map={response:DB.deletedResponseIds,test_record:DB.deletedTestRecordIds,link_tab:DB.deletedLinkTabIds};
    rows.forEach(row=>{
      const arr=map[row.kind];
      if(!arr)return;
      if(!arr.includes(row.item_id))arr.push(row.item_id);
    });
    // 다른 브라우저에서 삭제한 항목이 이 브라우저에 이미 남아있다면 지금 바로 제거
    DB.responses=(DB.responses||[]).filter(r=>!DB.deletedResponseIds.includes(r.id));
    DB.testRecords=(DB.testRecords||[]).filter(r=>!DB.deletedTestRecordIds.includes(r.id));
    DB.linkTabs=(DB.linkTabs||[]).filter(t=>!DB.deletedLinkTabIds.includes(t.id));
    if(!DB.linkTabs.length)DB.linkTabs=[{id:'default',name:'기본',links:[]}];
    save();
  }catch(e){console.warn('삭제 기록 동기화 오류:',e);}
}

let DASH_YEAR=''; // 대시보드 연도 필터

  const R=DB.responses.filter(r=>T.find(t=>t.id===r.trainingId));
  const totalAvg=avg(T.filter(t=>respOf(t.id).length).map(t=>trainingAvg(t.id)));
  const ranked=T.filter(t=>respOf(t.id).length>=4).map(t=>({t,v:trainingAvg(t.id)})).sort((a,b)=>b.v-a.v);
  const best=ranked[0],worst=ranked[ranked.length-1];
  const months=[...new Set(T.map(t=>t.date.slice(0,7)))].sort();
  const mVals=months.map(m=>avg(T.filter(t=>t.date.startsWith(m)&&respOf(t.id).length).map(t=>trainingAvg(t.id)))).map(v=>v||null);

      ${DASH_YEAR?`<span class="badge green">${DASH_YEAR}년 기준</span>`:''}
      <span class="card-sub">${T.length}개 교육 · ${R.length}개 응답</span>
    </div>
  </div>
  <div class="grid g4">
    ${kpi('총 교육수',T.length,'개','올해 누적')}
    ${kpi('총 응답자',R.length,'명','전체 설문 응답')}
    ${kpi('평균 응답률',pct(avg(T.map(trainingRate))),'','교육대상자 대비','up')}
    ${kpi('평균 만족도',f1(totalAvg),'점','강의평가 기준 · 5점',totalAvg>=4.2?'up':'flat')}
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card card-pad"><div class="spread"><div><div class="card-title">가장 만족도가 높은 과정</div>
      <div class="card-sub">${best?esc(best.t.name)+' '+best.t.round+'차 · '+best.t.date:'-'}</div></div>
      <span class="badge green">BEST ${best?f1(best.v):'-'}점</span></div></div>
    <div class="card card-pad"><div class="spread"><div><div class="card-title">가장 개선이 필요한 과정</div>
      <div class="card-sub">${worst?esc(worst.t.name)+' '+worst.t.round+'차 · '+worst.t.date:'-'}</div></div>
      <span class="badge red">FOCUS ${worst?f1(worst.v):'-'}점</span></div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card card-pad"><div class="card-title">월별 만족도 추이</div><div class="card-sub">과정 평균</div>
      <div style="margin-top:10px">${chLine(mm.map(m=>m.slice(2).replace('-','.')),vv)}</div></div>
    <div class="card card-pad"><div class="card-title">교육유형별 만족도</div>

async function saveEditTraining(tid){
  const t=byId(DB.trainings,tid);
  if(!t)return;
  const name=$('#fName').value.trim(),date=$('#fDate').value;
  if(!name||!date){toast('교육명과 교육일을 입력해주세요');return;}
  const lectures=LECT_DRAFT.filter(L=>L.title.trim()).map((L,i)=>{
    let iid=L.instructorId;
    const iname=(L.instructorName||'').trim();
    if(!iid&&iname){
      const existing=DB.instructors.find(x=>x.name===iname);
      if(existing){iid=existing.id;}
      else{iid='i'+Date.now()+'_'+i;DB.instructors.push({id:iid,name:iname,field:'',bio:''});sbUpsert('instructors',{id:iid,name:iname,field:'',bio:''});}
    }
    // 강사 field 업데이트
    if(iid&&L.field){const ins=byId(DB.instructors,iid);if(ins&&!ins.field)ins.field=L.field;}
    return {id:L.id||'L'+i,title:L.title.trim(),slot:L.slot||'',instructorId:iid||'',instructorName:iname,field:L.field||'',isTest:!!L.isTest};
  });
  t.name=name;t.date=date;t.round=+$('#fRound').value||1;
  t.type=$('#fType').value;t.place=$('#fPlace').value.trim()||'미정';
  t.invited=+$('#fInvited').value||15;t.lectures=lectures;
  t.attendees=ATT_DRAFT.filter(a=>a.name.trim());
  save();
  await sbUpsert('trainings',{id:tid,name:t.name,date:t.date,round:t.round,
    type:t.type,place:t.place,invited:t.invited,lectures:t.lectures,
    attendees:t.attendees,status:t.status,budget:t.budget||[],checkins:t.checkins||[]});
  closeModal();render();toast('교육이 수정되었습니다');
}

async function pasteFromClipboard(type){
  try{
    const text = await navigator.clipboard.readText();
    if(!text){toast('클립보드가 비어있습니다');return;}
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length){toast('데이터가 없습니다');return;}
    // 탭 또는 쉼표 구분
    const sep = lines[0].includes('\t') ? '\t' : ',';
    if(type==='lect'){
      const start = /^[0-9:]/.test(lines[0]) ? 0 : 1;
      const added=[];
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(sep).map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols.length>=2&&cols[1]) added.push({slot:cols[0]||'',title:cols[1]||'',field:cols[2]||'',instructorName:cols[3]||'',instructorId:''});
      }
      if(added.length){LECT_DRAFT=[...LECT_DRAFT,...added];renderLectRows();toast('강의 '+added.length+'개 붙여넣기 완료');}
      else toast('강의 데이터를 찾을 수 없습니다');
    } else {
      const start = lines[0].split(sep).length>=3&&/[가-힣]/.test(lines[0]) ? 0 : 1;
      const added=[];
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(sep).map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols.length>=3&&cols[2]) added.push({team:cols[0]||'',store:cols[1]||'',name:cols[2]||''});
      }
      if(added.length){ATT_DRAFT=[...ATT_DRAFT,...added];renderAttRows();toast('참석자 '+added.length+'명 붙여넣기 완료');}
      else toast('참석자 데이터를 찾을 수 없습니다');
    }
  }catch(e){
    toast('클립보드 읽기 실패 — 브라우저 권한을 허용해주세요');
    console.warn(e);
  }
}

function uploadLectExcel(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
    // 첫 행 헤더 감지 (숫자로 시작하지 않으면 헤더)
    const start=lines[0]&&/^[0-9:]/i.test(lines[0].trim())?0:1;
    const added=[];
    for(let i=start;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.replace(/^["']|["']$/g,'').trim());
      if(cols.length>=2&&cols[1]){
        added.push({
          title:cols[1]||'',
          slot:cols[0]||'',
          field:cols[2]||'',
          instructorName:cols[3]||'',
          instructorId:''
        });

    }
    LECT_DRAFT=[...LECT_DRAFT,...added];
    renderLectRows();
    toast(`✅ 강의 ${added.length}개 추가됨`);
  };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}

function _modalPasteHandler(e){
  const modal=document.getElementById('modal');
  if(!modal||!modal.innerHTML)return;
  // 이미지 붙여넣기 (사진)
  const items=e.clipboardData?.items||[];
  for(const item of items){
    if(item.type.startsWith('image/')){
      // 활성 사진 슬롯 찾기
      const activeLabel=document.querySelector('.rp-photos-full label:focus, .rp-photos-full label:hover');
      return; // 사진은 개별 핸들러에서 처리
    }
  }
  // 텍스트 붙여넣기
  const text=e.clipboardData?.getData('text');
  if(!text)return;
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return;
  // 탭으로 구분된 엑셀 데이터인지 확인
  const hasTabs=lines[0].includes('\t');
  if(!hasTabs)return;
  // 강의 구성 모달인지 참석자 모달인지 판단
  if(document.getElementById('lectList')){
    e.preventDefault();
    pasteLectData(e);
  } else if(document.getElementById('attList')){
    e.preventDefault();
    pasteAttData(e);
  }
}

function dropExcelData(e, type){
  const file=e.dataTransfer.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const text=ev.target.result;
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    const start=lines[0]&&/^[0-9:가-힣]/i.test(lines[0])?0:1;
    if(type==='lect'){
      const added=[];
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(/\t|,/).map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols.length>=2&&cols[1])added.push({slot:cols[0]||'',title:cols[1]||'',field:cols[2]||'',instructorName:cols[3]||'',instructorId:''});
      }
      LECT_DRAFT=[...LECT_DRAFT,...added];
      renderLectRows();toast(`강의 ${added.length}개 추가됨`);
    } else {
      const added=[];
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(/\t|,/).map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols.length>=3&&cols[2])added.push({team:cols[0]||'',store:cols[1]||'',name:cols[2]||''});
      }
      ATT_DRAFT=[...ATT_DRAFT,...added];
      renderAttRows();toast(`참석자 ${added.length}명 추가됨`);
    }
  };
  reader.readAsText(file,'UTF-8');
}

function pasteLectData(e){
  const text=e.clipboardData?.getData('text');
  if(!text)return;
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const added=[];
  lines.forEach(line=>{
    const cols=line.split('\t').map(c=>c.trim()); // 엑셀은 탭 구분
    if(cols.length>=2&&cols[1]){
      added.push({slot:cols[0]||'',title:cols[1]||'',field:cols[2]||'',instructorName:cols[3]||'',instructorId:''});
    }
  });
  if(added.length){LECT_DRAFT=[...LECT_DRAFT,...added];renderLectRows();toast(`강의 ${added.length}개 붙여넣기 완료`);}
}

  const text=e.clipboardData?.getData('text');

  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const added=[];
  lines.forEach(line=>{
    const cols=line.split('\t').map(c=>c.trim());
    if(cols.length>=3&&cols[2]){added.push({team:cols[0]||'',store:cols[1]||'',name:cols[2]||''});}
  });
  if(added.length){ATT_DRAFT=[...ATT_DRAFT,...added];renderAttRows();toast(`참석자 ${added.length}명 붙여넣기 완료`);}
}
function uploadAttExcel(e){
  const file=e.target.files[0];if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    const reader=new FileReader();
    reader.onload=ev=>{
      const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
      // 첫 행이 헤더인지 판단 (숫자 없으면 헤더)
      const start=isNaN(lines[0].split(',')[0])?1:0;
      const added=[];
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(',').map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols.length>=3&&cols[2]){added.push({team:cols[0]||'',store:cols[1]||'',name:cols[2]});}
      }
      ATT_DRAFT=[...ATT_DRAFT,...added];
      renderAttRows();
      toast(`✅ ${added.length}명 추가됨`);
    };
    reader.readAsText(file,'UTF-8');
  } else {
    // xlsx: SheetJS CDN 없으면 CSV로 저장 안내
    toast('xlsx 파일은 CSV로 저장 후 업로드해주세요 (다른이름으로 저장 → CSV)');
  }
  e.target.value=''; // 파일 초기화
}

  const rowsA=cands.map(L=>{
    const ins=byId(DB.instructors,L.instructorId);

    return `<div class="spread" style="padding:8px 4px;border-bottom:1px dashed var(--border)">
      <label class="row" style="gap:8px;cursor:pointer;font-size:.88rem">
        <input type="checkbox" ${on?'checked':''} onchange="toggleSurveyLect('${t.id}','${L.id}')">
        <span style="font-weight:700;${on?'':'color:var(--ink4);text-decoration:line-through'}">${esc(L.title)}</span>

        ${L.isTest?'<span class="badge amber">설문제외</span>':''}

  const rowsB=extras.map(e=>`<div class="spread" style="padding:8px 4px;border-bottom:1px dashed var(--border);gap:8px">
      <div class="row" style="gap:8px;flex:1">
        <span class="badge green">추가 문항</span>

          onblur="updateSurveyExtraTitle('${t.id}','${e.id}',this.value)">

}

let RQ={year:'',name:'',round:'',type:'',sel:'',sortKey:'date',sortDir:-1};

  // 정렬 적용
  list=list.slice().sort((a,b)=>{
    if(RQ.sortKey==='date') return RQ.sortDir*(a.date<b.date?-1:a.date>b.date?1:0);

    if(RQ.sortKey==='avg'){

    return 0;
  });
  const sel=RQ.sel?byId(DB.trainings,RQ.sel):null;
  // 정렬 헤더 헬퍼

    return `<tr class="click" onclick="RQ.sel='${t.id}';rerender()">

function vCourseDash(t){
  const rs=respOf(t.id);if(!rs.length)return '<div class="empty">아직 응답이 없습니다</div>';
  // lstats: 첫/마지막 제외 + 동일강사 중복 제거
  const _seenL=new Set();
  const lstats=t.lectures.filter((L,i,arr)=>{
    if(i===0||i===arr.length-1)return false; // 첫/마지막 제외
    if(L.title&&L.title.includes('점심식사'))return false; // 점심식사 제외
    if(L.title&&L.title.includes('가치공유'))return false; // 가치공유 제외
    const k=L.instructorId||L.instructorName||L.title;
    if(k&&_seenL.has(k))return false;
    if(k)_seenL.add(k);
    return true;
  }).map(L=>({L,s:lectureAvg(t.id,L.id)}));
  const recCnt={};rs.forEach(r=>{if(r.recommendLecture)recCnt[r.recommendLecture]=(recCnt[r.recommendLecture]||0)+1;});
  const recTop=Object.entries(recCnt).sort((a,b)=>b[1]-a[1]);
  const bestL=recTop[0]?lectOf(t,recTop[0][0]):null;
  return `<div style="margin-top:18px">
   <div class="spread"><div><div class="card-title" style="font-size:1.08rem">${esc(t.name)} ${t.round}차 — 과정 Dashboard</div>
     <div class="card-sub">${t.date} · ${t.type} · ${esc(t.place)}</div></div>
    <div class="row">
     <button class="btn sm" onclick="dlRaw('${t.id}')">⬇ 설문 로우데이터</button>
     <button class="btn sm" onclick="dlLect('${t.id}')">⬇ 강의별 요약</button>
     <button class="btn sm primary" onclick="AIQ='${t.id}';nav('#/ai')">AI 분석 보기</button></div></div>
   <div class="grid g4" style="margin-top:12px">
    ${kpi('평균 만족도',f1(trainingAvg(t.id)),'점','강의평가 종합',trainingAvg(t.id)>=4.2?'up':'flat')}
    ${kpi('응답자',rs.length,'명',`초대 ${t.invited}명`)}
    ${kpi('응답률',pct(trainingRate(t)),'','제출 기준',trainingRate(t)>=85?'up':'flat')}
    ${kpi('추천 1위 강의',bestL?recTop[0][1]:'-','표',bestL?esc(bestL.title.slice(0,14)):'응답 없음','up')}
   </div>
   <div class="grid g2" style="margin-top:14px">
    <div class="card card-pad"><div class="card-title">강의별 만족도</div><div class="card-sub">문항 ①+② 평균</div>
     <div style="margin-top:10px">${chHBars(lstats.map(x=>x.L.title.slice(0,16)),lstats.map(x=>x.s.total),{lw:180})}</div></div>
    <div class="card card-pad"><div class="card-title">강의별 상세</div><div class="card-sub">전문성·전달력 / 실무 적용성</div>
     <table class="tbl" style="margin-top:8px"><thead><tr><th>강의</th><th>강사</th><th>①전문성</th><th>②실무</th><th>추천</th></tr></thead><tbody>
      ${lstats.map(({L,s})=>`<tr><td style="font-weight:700;font-size:.85rem">${esc(L.title.slice(0,16))}</td>
       <td>${esc(byId(DB.instructors,L.instructorId)?.name||'')}</td>
       <td class="num">${f1(s.expert)}</td><td class="num">${f1(s.practical)}</td>
       <td class="num">${recCnt[L.id]||0}표</td></tr>`).join('')}
     </tbody></table></div>
   </div></div>`;
}
function dlAll(){
  const rows=[['응답ID','교육명','차수','교육일','유형','제출시각','강의','①전문성·전달력','②실무적용','좋았던 점','개선이 필요한 점','추천강의','추가필요콘텐츠','기타의견']];
  DB.responses.forEach(r=>{const t=byId(DB.trainings,r.trainingId);if(!t)return;
    t.lectures.forEach((L,li)=>{const v=r.lect[L.id];if(!v)return;
      rows.push([r.id,t.name,t.round,t.date,t.type,r.at,lectLabel(t,L),LIKERT[v.expert-1],LIKERT[v.practical-1],v.good,v.improve,
        li===0?(lectOf(t,r.recommendLecture)?.title||''):'',li===0?r.need:'',li===0?r.etc:'']);});});
  csv(rows,'전체응답.csv');
}
function dlLect(tid){const t=byId(DB.trainings,tid);
  const rows=[['강의','강사','①전문성·전달력','②실무적용','평균','추천수','평가수']];
  const recCnt={};respOf(tid).forEach(r=>{if(r.recommendLecture)recCnt[r.recommendLecture]=(recCnt[r.recommendLecture]||0)+1;});
  t.lectures.forEach(L=>{const s=lectureAvg(tid,L.id);
    rows.push([L.title,byId(DB.instructors,L.instructorId)?.name,f1(s.expert),f1(s.practical),f1(s.total),recCnt[L.id]||0,s.n]);});
  csv(rows,`강의별결과_${t.name}_${t.round}차.csv`);}

function dlRaw(tid){
  // 교육과정별 설문 로우데이터 (응답자 1행 기준)
  const t=byId(DB.trainings,tid);
  const rs=respOf(tid);
  if(!rs.length){toast('응답 데이터가 없습니다');return;}
  // 헤더: 기본정보 + 강의별 전문성/실무적용/좋았던점/개선점 + 과정전체
  const header=['No','제출시각','교육명','차수','교육일','유형'];
  t.lectures.forEach((L,i)=>{
    const ins=byId(DB.instructors,L.instructorId);
    const prefix=`[강의${i+1}] ${L.title}(${ins?.name||''})`;
    header.push(`${prefix} - 전문성`,`${prefix} - 실무적용`,`${prefix} - 좋았던점`,`${prefix} - 개선이필요한점`);
  });
  header.push('추천강의','추가필요콘텐츠','기타의견');
  const rows=[header];
  rs.forEach((r,idx)=>{
    const row=[idx+1, r.at.replace('T',' ').slice(0,16), t.name, t.round, t.date, t.type];
    t.lectures.forEach(L=>{
      const v=r.lect[L.id]||{};
      row.push(
        LIKERT[(v.expert||1)-1]||'',
        LIKERT[(v.practical||1)-1]||'',
        v.good||'',
        v.improve||''
      );
    });
    row.push(
      lectOf(t,r.recommendLecture)?.title||'',
      r.need||'',
      r.etc||''
    );
    rows.push(row);
  });
  csv(rows,`설문로우데이터_${t.name}_${t.round}차_${t.date}.csv`);
  toast(`설문 로우데이터 ${rs.length}건 다운로드 완료`);
}

let RPQ='';
function isValidOpinion(v){
  if(!v||v.trim().length<=2)return false;
  if(/^[ㄱ-ㅎㅏ-ㅣ\s!?~\.]+$/.test(v.trim()))return false;
  if(/^(.){2,}$/.test(v.trim()))return false;
  return true;
}

// Gemini로 의견 텍스트 정제 (오타/맥락 안 맞는 단어 수정)
const _opinionCache={};
async function cleanOpinionsWithAI(opinions){
  if(!opinions.length)return opinions;
  const key=opinions.join('|');
  if(_opinionCache[key])return _opinionCache[key];
  try{
    const prompt=`다음은 교육 만족도 설문에서 수집된 참석자 의견입니다.
각 항목을 아래 규칙에 따라 처리해주세요:

1. 오타나 잘못 입력된 글자는 문맥에 맞게 수정해주세요 (예: "씹어요" → "쉬워요", "조아요" → "좋아요", "이해하기 씹어요" → "이해하기 쉬워요")
2. 교육 맥락에서 의미를 유추할 수 있으면 최대한 수정해서 살려주세요
3. 아무리 봐도 의미를 알 수 없는 경우에만 빈 문자열("")로 바꿔주세요
4. 맞춤법이 맞고 의미가 명확한 항목은 그대로 유지하세요

JSON 배열로만 응답하세요 (설명 없이, 마크다운 없이):
${JSON.stringify(opinions)}`;
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    const data=await res.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    const clean=text.replace(/\`\`\`json|\`\`\`/g,'').trim();
    const result=JSON.parse(clean);
    if(Array.isArray(result)){
      const filtered=result.filter(v=>v&&v.trim().length>2);
      _opinionCache[key]=filtered;
      return filtered;
    }
  }catch(e){console.warn('AI 정제 오류:',e);}
  return opinions;
}
function lectOpinions(L,rsArr){
  const rs2=rsArr||DB.responses;
  const goods=[],imps=[];
  rs2.forEach(r=>{const v=r.lect[L.id];if(!v)return;
    if(isValidOpinion(v.good))goods.push(v.good.trim());
    if(isValidOpinion(v.improve))imps.push(v.improve.trim());});
  const uniq=arr=>[...new Set(arr)].slice(0,4);
  return{goods:uniq(goods),imps:uniq(imps)};
}
// AI 정제 포함 버전 (보고서 다운로드 시 사용)
async function lectOpinionsAI(L,rsArr){
  const base=lectOpinions(L,rsArr);
  const goods=await cleanOpinionsWithAI(base.goods);
  const imps=await cleanOpinionsWithAI(base.imps);
  return{goods,imps};
}

function _reportPhotoPasteHandler(e){
  if(!RPQ)return;
  const items=e.clipboardData?.items||[];
  for(const item of items){
    if(item.type.startsWith('image/')){
      e.preventDefault();
      const file=item.getAsFile();
      if(!file)return;
      if(file.size>3*1024*1024){toast('사진은 3MB 이하로 올려주세요');return;}
      const reader=new FileReader();
      reader.onload=ev=>{
        const t=byId(DB.trainings,RPQ);
        if(!t.photos)t.photos=[];
        // 빈 슬롯 찾기
        let slot=t.photos.findIndex(p=>!p);
        if(slot===-1)slot=t.photos.length;
        if(slot>=6){toast('사진은 최대 6장까지 가능합니다');return;}
        t.photos[slot]=ev.target.result;
        sbPatch('trainings',RPQ,{photos:t.photos});
        save();render();toast(`📷 사진 ${slot+1} 추가되었습니다`);
      };
      reader.readAsDataURL(file);
      return;
    }
  }
}

async function pasteConnectingImg(tid){
  try{
    const items=await navigator.clipboard.read();
    for(const item of items){
      const imgType=item.types.find(t=>t.startsWith('image/'));
      if(imgType){
        const blob=await item.getType(imgType);
        // 크기 확인
        if(blob.size>3*1024*1024){toast('⚠️ 이미지가 너무 커요! 3MB 이하 이미지를 사용해주세요.');return;}
        const reader=new FileReader();
        reader.onload=async e=>{
          const t=byId(DB.trainings,tid);
          if(!t)return;
          // 이미지 압축 (최대 1200px)
          const img=new Image();
          img.onload=()=>{
            const MAX=1200;
            let w=img.width,h=img.height;
            if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
            const canvas=document.createElement('canvas');
            canvas.width=w;canvas.height=h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            const compressed=canvas.toDataURL('image/jpeg',0.85);
            t.connectingDayImg=compressed;
            save();
            sbPatch('trainings',tid,{checkins:t.checkins||[]});
            render();
            toast('✅ 이미지 붙여넣기 완료!');
          };
          img.src=e.target.result;
        };
        reader.readAsDataURL(blob);
        return;
      }
    }
    toast('⚠️ 클립보드에 이미지가 없어요. 이미지를 먼저 복사해주세요!');
  }catch(e){
    toast('⚠️ 클립보드 접근 실패. 브라우저 권한을 확인해주세요.');
    console.error(e);
  }
}

async function printAgenda(){
  const doc=document.getElementById('agendaDoc');
  if(!doc||!AQ){toast('교육을 먼저 선택해주세요');return;}
  const t=byId(DB.trainings,AQ);
  if(!t){toast('교육을 먼저 선택해주세요');return;}
  try{
    toast('📄 PDF 생성 중...(잠시 기다려주세요)');
    // no-print 요소 임시 숨기기
  const noPrints=doc.querySelectorAll('.no-print');
  noPrints.forEach(el=>el.style.display='none');
  const canvas=await html2canvas(doc,{scale:2,useCORS:true,logging:false,backgroundColor:'#fff'});
  noPrints.forEach(el=>el.style.display='');
    const imgData=canvas.toDataURL('image/jpeg',0.95);
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pdfW=pdf.internal.pageSize.getWidth();
    const pdfH=pdf.internal.pageSize.getHeight();
    const ratio=pdfW/canvas.width;
    const totalH=canvas.height*ratio;
    let y=0;
    while(y<totalH){
      if(y>0)pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,-y,pdfW,totalH);
      y+=pdfH;
    }
    pdf.save(`${t.name}_${t.round}차_교육진행안.pdf`);
    toast('✅ PDF 다운로드 완료!');
  }catch(e){
    console.error('PDF 오류:',e);
    toast('⚠️ PDF 생성 실패 - 미리보기로 전환');
    const allStyles=[...document.styleSheets].filter(s=>{try{return s.cssRules}catch(e){return false}})
      .flatMap(s=>[...s.cssRules]).map(r=>r.cssText).join('\n');
    const w=window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>${t.name} ${t.round}차 교육진행안</title>

/* ═══════════ 설정 ═══════════ */
function vFeedback(){
  if(!session)return '<div class="card card-pad"><div class="empty">로그인 후 이용할 수 있습니다</div></div>';
  const tlist=DB.trainings.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!FBQ&&tlist.length)FBQ=tlist[0].id;
  const t=FBQ?byId(DB.trainings,FBQ):null;

  // 강사 목록 (해당 교육 강의에서 추출, 제외 강의·테스트/설문제외 과목 빼고 — 설문 응답 자체가 없음)
  const fbLects=t?t.lectures.filter((L,i,arr)=>{
    if(i===0||i===arr.length-1)return false;
    if(L.title&&(L.title.includes('점심식사')||L.title.includes('가치공유')))return false;
    if(!lectSurveyOn(L))return false;
    return true;
  }):[];
  // 강사 중복 제거
  const seen=new Set();
  const instrList=fbLects.filter(L=>{
    const k=L.instructorId||L.instructorName||L.title;
    if(seen.has(k))return false;
    seen.add(k); return true;
  }).map(L=>{
    const ins=byId(DB.instructors,L.instructorId);
    return {id:L.instructorId||L.id, name:L.instructorName||ins?.name||L.title, lectId:L.id};
  });

  if(!window._FBINSTR&&instrList.length)window._FBINSTR=instrList[0].id;
  const selInstr=window._FBINSTR;

  const sel=`<div class="card card-pad" style="margin-bottom:14px">
    <div class="spread" style="flex-wrap:wrap;gap:10px;align-items:flex-end">
      <div>
        <div style="font-weight:800;margin-bottom:6px">교육 선택</div>
        <select class="select" style="min-width:240px" onchange="FBQ=this.value;window._FBINSTR='';render()">
          <option value="">-- 교육을 선택하세요 --</option>
          ${tlist.map(tr=>`<option value="${tr.id}" ${FBQ===tr.id?'selected':''}>${esc(tr.name)} ${tr.round}차 (${tr.date})</option>`).join('')}
        </select>
      </div>
      ${t&&instrList.length?`<div>
        <div style="font-weight:800;margin-bottom:6px">강사 선택</div>
        <select class="select" style="min-width:180px" onchange="window._FBINSTR=this.value;render()">
          ${instrList.map(ins=>`<option value="${ins.id}" ${selInstr===ins.id?'selected':''}>${esc(ins.name)}</option>`).join('')}
        </select>
      </div>`:''}
    </div>
  </div>`;

  if(!t)return sel+'<div class="empty">교육을 선택해주세요</div>';
  if(!instrList.length)return sel+'<div class="empty">피드백 대상 강사가 없습니다</div>';

  // 선택된 강사의 강의들
  const myLects=fbLects.filter(L=>{
    const k=L.instructorId||L.id;
    return k===selInstr||(L.instructorName&&instrList.find(i=>i.id===selInstr)?.name===L.instructorName);
  });
  if(!myLects.length)return sel+'<div class="empty">해당 강사의 강의가 없습니다</div>';

  const rs=respOf(FBQ);
  const instrName=instrList.find(i=>i.id===selInstr)?.name||'';

  // 강의별 통계 + 의견
  const lectData=myLects.map(L=>{
    const s=lectureAvg(FBQ,L.id);
    const{goods,imps}=lectOpinions(L,rs);
    return{L,s,goods,imps};
  });

  // 전체 평균
  // 그래프 바
  function bar(val,max=5,color='#0e5a34'){
    const pct=Math.round((val/max)*100);
    return `<div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;height:14px;background:#e4e7e2;border-radius:7px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:7px;transition:width .4s"></div>
      </div>
      <span style="font-size:.82rem;font-weight:700;color:${color};min-width:32px">${f1(val)}</span>
    </div>`;
  }

  // 피드백 데이터 (수정 가능한 주관식)
  if(!t.feedback)t.feedback={};
  if(!t.feedback[selInstr])t.feedback[selInstr]={goods:[],imps:[]};
  const fb=t.feedback[selInstr];
  // 초기 로드 시 설문 의견으로 초기화
  if(!fb._loaded){
    const allGoods=[...new Set(lectData.flatMap(d=>d.goods))];
    const allImps=[...new Set(lectData.flatMap(d=>d.imps))];
    if(!fb.goods.length)fb.goods=[...allGoods];
    if(!fb.imps.length)fb.imps=[...allImps];
    fb._loaded=true;
    save();
  }

  const goodRows=fb.goods.map((g,gi)=>`
    <tr>
      <td style="padding:6px 8px;vertical-align:top">
        <span contenteditable="true" style="outline:none;border-bottom:1px dashed #aaa;display:inline-block;min-width:80px"
          onblur="editFBOpinion('${FBQ}','${selInstr}','goods',${gi},this.innerText)">${esc(g)}</span>
      </td>
      <td style="padding:6px 8px;text-align:center;vertical-align:top">
        <button onclick="delFBOpinion('${FBQ}','${selInstr}','goods',${gi})"
          style="background:none;border:none;cursor:pointer;color:#aaa;font-size:.8rem">✕</button>
      </td>
    </tr>`).join('');

  const impRows=fb.imps.map((g,gi)=>`
    <tr>
      <td style="padding:6px 8px;vertical-align:top">
        <span contenteditable="true" style="outline:none;border-bottom:1px dashed #aaa;display:inline-block;min-width:80px"
          onblur="editFBOpinion('${FBQ}','${selInstr}','imps',${gi},this.innerText)">${esc(g)}</span>
      </td>
      <td style="padding:6px 8px;text-align:center;vertical-align:top">
        <button onclick="delFBOpinion('${FBQ}','${selInstr}','imps',${gi})"
          style="background:none;border:none;cursor:pointer;color:#aaa;font-size:.8rem">✕</button>
      </td>
    </tr>`).join('');

  return sel+`
  <div class="card card-pad">
    <div style="font-size:1.05rem;font-weight:900;color:var(--green);margin-bottom:4px">
      ${esc(instrName)} 강사 피드백
    </div>
    <div style="font-size:.8rem;color:var(--ink3);margin-bottom:16px">
      ${esc(t.name)} ${t.round}차 · ${rs.length}명 응답
    </div>

    <!-- 그래프 -->
    <div style="display:flex;gap:14px;margin-bottom:20px">
      <div style="flex:1;min-width:0;background:var(--surface2);border-radius:10px;padding:14px">
        <div style="font-weight:800;font-size:.85rem;margin-bottom:10px">⭐ 전문성 및 전달력</div>
        ${lectData.map(({L,s})=>s.n>0?`
          <div style="margin-bottom:8px">
            <div style="font-size:.75rem;color:var(--ink3);margin-bottom:3px">${esc(L.title)}</div>
            ${bar(s.expert,5,'#0e5a34')}
          </div>`:``).join('')}

      </div>
      <div style="flex:1;min-width:0;background:var(--surface2);border-radius:10px;padding:14px">
        <div style="font-weight:800;font-size:.85rem;margin-bottom:10px">💡 실무 적용 가능성</div>
        ${lectData.map(({L,s})=>s.n>0?`
          <div style="margin-bottom:8px">
            <div style="font-size:.75rem;color:var(--ink3);margin-bottom:3px">${esc(L.title)}</div>
            ${bar(s.practical,5,'#0e5a34')}
          </div>`:``).join('')}

      </div>
    </div>

    <!-- 의견 표 -->
    <div class="g2" style="gap:14px">
      <div>
        <div style="font-weight:800;font-size:.85rem;margin-bottom:8px;color:#0e5a34">👍 좋았던 점</div>
        <table style="width:100%;border-collapse:collapse;font-size:.8rem">
          <thead><tr style="border-bottom:2px solid #0e5a34">
            <th style="padding:6px 8px;text-align:left;color:#0e5a34">의견</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody>${goodRows||'<tr><td style="padding:8px;color:#aaa">의견 없음</td></tr>'}</tbody>
        </table>
        <button onclick="addFBOpinion('${FBQ}','${selInstr}','goods')"
          style="margin-top:8px;background:none;border:1px dashed #0e5a34;color:#0e5a34;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.78rem">+ 의견 추가</button>
      </div>
      <div>
        <div style="font-weight:800;font-size:.85rem;margin-bottom:8px;color:#c62828">👎 아쉬운 점</div>
        <table style="width:100%;border-collapse:collapse;font-size:.8rem">
          <thead><tr style="border-bottom:2px solid #c62828">
            <th style="padding:6px 8px;text-align:left;color:#c62828">의견</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody>${impRows||'<tr><td style="padding:8px;color:#aaa">의견 없음</td></tr>'}</tbody>
        </table>
        <button onclick="addFBOpinion('${FBQ}','${selInstr}','imps')"
          style="margin-top:8px;background:none;border:1px dashed #c62828;color:#c62828;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.78rem">+ 의견 추가</button>
      </div>
    </div>

    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn primary" onclick="saveFeedback('${FBQ}','${selInstr}')">💾 저장</button>
      <button class="btn ghost" onclick="resetFBOpinions('${FBQ}','${selInstr}')">🔄 설문 의견으로 초기화</button>
    </div>
  </div>`;
}

function editFBOpinion(tid,instr,type,idx,val){
  const t=byId(DB.trainings,tid);
  if(!t||!t.feedback?.[instr])return;
  t.feedback[instr][type][idx]=val.trim();
  save();
}

function delFBOpinion(tid,instr,type,idx){
  const t=byId(DB.trainings,tid);
  if(!t||!t.feedback?.[instr])return;
  t.feedback[instr][type].splice(idx,1);
  save(); render();
}

function addFBOpinion(tid,instr,type){
  const t=byId(DB.trainings,tid);
  if(!t)return;
  if(!t.feedback)t.feedback={};
  if(!t.feedback[instr])t.feedback[instr]={goods:[],imps:[]};
  t.feedback[instr][type].push('새 의견');
  save(); render();
}

function saveFeedback(tid,instr){
  const t=byId(DB.trainings,tid);
  if(!t)return;
  save();
  sbPatch('trainings',tid,{attendees:t.attendees||[]});
  toast('✅ 피드백이 저장됐어요!');
}

function resetFBOpinions(tid,instr){
  if(!confirm('설문 의견으로 초기화할까요?'))return;
  const t=byId(DB.trainings,tid);
  if(!t)return;
  if(!t.feedback)t.feedback={};
  if(t.feedback[instr])t.feedback[instr]._loaded=false;
  save(); render();
}

/* ═══════════ 테스트 이력관리 ═══════════ */
const TESTLOG_ROLES=['점장','부점장','OFC','개점지원담당'];
let TL_ROLE=TESTLOG_ROLES[0];
let TL_Q='';
let TL_TEST=null; // 선택된 테스트명 — null이면 테스트 목록 화면, 값이 있으면 그 테스트의 대쉬보드+개인별 성적 화면
let TL_BULK=null; // 추가/수정 draft: {mode,editId,role,testName,date,subjects:[],rows:[]}
let TL_INLINE_OPEN=false; // "+ 테스트 결과 추가"를 눌렀을 때 팝업 대신 페이지 안에 표를 펼칠지 여부

// 사번으로 같은 사람의 "직전 응시" 기록을 찾아 전차수 대비 점수 변화를 계산 (같은 직책 안에서, 이 기록보다 날짜가 빠른 것 중 가장 최근)
function tlPrevRecord(role,empNo,beforeDate,excludeId){
  if(!empNo||!beforeDate)return null;
  const candidates=(DB.testRecords||[]).filter(r=>r.role===role&&r.empNo===empNo&&r.id!==excludeId&&r.date&&r.date<beforeDate);
  if(!candidates.length)return null;
  return candidates.sort((a,b)=>a.date<b.date?1:-1)[0];
}
// 고정 열(팀/사번/근속/응시일/총점수/전차수 대비/통과여부/비고)도 과목처럼 화면에서 지웠다 되살릴 수 있게 관리
const TL_FIXED_COLS=[
  {key:'store',label:'팀',thStyle:'min-width:80px',
    cell:r=>`<td><input class="input" style="padding:4px 6px;font-size:.78rem" value="${esc(r.store||'')}" onchange="updateTestField('${r.id}','store',this.value)"></td>`},
  {key:'empNo',label:'사번',thStyle:'min-width:90px',
    cell:r=>`<td><input class="input num" style="padding:4px 6px;font-size:.78rem" value="${esc(r.empNo||'')}" onchange="updateTestField('${r.id}','empNo',this.value)"></td>`},
  {key:'tenure',label:'근속',thStyle:'min-width:80px',
    cell:r=>`<td><input class="input" style="padding:4px 6px;font-size:.78rem" value="${esc(r.tenure||'')}" onchange="updateTestField('${r.id}','tenure',this.value)"></td>`},
  {key:'date',label:'응시일',thStyle:'min-width:120px',
    cell:r=>`<td><input class="input" type="date" style="padding:4px 6px;font-size:.78rem" value="${esc(r.date||'')}" onchange="updateTestField('${r.id}','date',this.value)"></td>`},
  {key:'score',label:'총점수',thStyle:'text-align:center;min-width:70px',
    cell:r=>`<td><input class="input num" style="padding:4px 6px;font-size:.78rem;width:56px;text-align:center" value="${r.score===''||r.score==null?'':esc(String(r.score))}" onchange="updateTestField('${r.id}','score',this.value)"></td>`},
  {key:'prevDelta',label:'전차수 대비',thStyle:'text-align:center;min-width:90px',
    cell:r=>{
      const prev=tlPrevRecord(r.role,r.empNo,r.date,r.id);
      if(!prev||prev.score===''||prev.score==null||r.score===''||r.score==null)
        return `<td style="text-align:center;color:var(--ink4)" title="사번이 일치하는 이전 응시 기록이 없습니다">-</td>`;
      const diff=Math.round(((+r.score||0)-(+prev.score||0))*10)/10;
      const sign=diff>0?'+':'';
      const color=diff>0?'var(--green,#0a7d43)':diff<0?'#be185d':'var(--ink3)';
      return `<td style="text-align:center;font-weight:800;color:${color}" title="직전 응시: ${esc(prev.testName||'')} · ${esc(prev.date||'')} · ${esc(String(prev.score))}점">${sign}${diff}</td>`;
    }},
  {key:'passed',label:'통과여부',thStyle:'text-align:center;min-width:90px',
    cell:r=>`<td style="${r.passed?'background:rgba(16,153,90,.12)':''}"><select class="select" style="padding:4px 6px;font-size:.78rem;font-weight:${r.passed?800:500};color:${r.passed?'var(--green,#10995a)':'inherit'}" onchange="updateTestField('${r.id}','passed',this.value)">
      <option value="1" ${r.passed?'selected':''}>합격</option><option value="0" ${!r.passed?'selected':''}>불합격</option></select></td>`},
  {key:'memo',label:'비고',thStyle:'min-width:140px',
    cell:r=>{
      // 개점지원담당 탭만 비고를 정해진 선택지 중에서 고르도록 함 (다른 탭은 자유 입력 그대로)
      if(r.role==='개점지원담당'){
        const hi=TL_MEMO_HILITE[r.memo]||'';
        return `<td><select class="select" style="padding:4px 6px;font-size:.78rem;font-weight:${hi?800:500};${hi}" onchange="updateTestField('${r.id}','memo',this.value)">
          <option value="" ${!r.memo?'selected':''}>선택안함</option>
          ${TL_MEMO_OPTS.map(o=>`<option value="${esc(o)}" ${r.memo===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select></td>`;
      }
      return `<td><input class="input" style="padding:4px 6px;font-size:.78rem" placeholder="비고" value="${esc(r.memo||'')}" onchange="updateTestField('${r.id}','memo',this.value)"></td>`;
    }},
];
// 개점지원담당 탭의 "비고" 선택지 — OFC대기는 파란색, 2차 불합격은 분홍색으로 강조
const TL_MEMO_OPTS=['OFC대기','OFC발령','1차 불합격','2차 불합격'];
const TL_MEMO_HILITE={
  'OFC대기':'background:rgba(37,99,235,.14);color:#1d4ed8',
  '2차 불합격':'background:rgba(219,39,119,.14);color:#be185d',
};
let TL_SORT={key:null,dir:1}; // 열 제목 클릭 시 오름/내림차순 정렬 상태
function sortTestCol(key){
  if(TL_SORT.key===key){TL_SORT.dir*=-1;}else{TL_SORT.key=key;TL_SORT.dir=1;}
  render();
}
function tlSortArrow(key){return TL_SORT.key===key?(TL_SORT.dir===1?' ▲':' ▼'):'';}
function tlSortVal(r,key){
  if(key==='person')return r.person||'';
  if(key==='passed')return r.passed?1:0;
  if(key==='score'){const v=r[key];return v===''||v==null?-Infinity:+v;}
  if(key==='prevDelta'){
    const prev=tlPrevRecord(r.role,r.empNo,r.date,r.id);
    if(!prev||prev.score===''||prev.score==null||r.score===''||r.score==null)return -Infinity;
    return (+r.score||0)-(+prev.score||0);
  }
  if(key==='store'||key==='empNo'||key==='tenure'||key==='date'||key==='memo')return r[key]||'';
  const s=(r.subjects||[]).find(x=>x.name===key);
  if(s)return s.score===''||s.score==null?-Infinity:+s.score;
  return '';
}
function tlAvgOf(list,getter){
  const nums=list.map(getter).filter(v=>v!==''&&v!=null&&!isNaN(+v)).map(v=>+v);
  return nums.length?f1(avg(nums)):'-';
}
function tlAvgFooterCell(c,rows){
  if(c.key==='score')return `<td style="text-align:center">${tlAvgOf(rows,r=>r[c.key])}</td>`;
  if(c.key==='passed'){const p=rows.filter(r=>r.passed).length;return `<td style="text-align:center;color:var(--green)">${rows.length?pct(p/rows.length*100):'-'}</td>`;}
  if(c.key==='prevDelta'){
    const diffs=rows.map(r=>{
      const prev=tlPrevRecord(r.role,r.empNo,r.date,r.id);
      if(!prev||prev.score===''||prev.score==null||r.score===''||r.score==null)return null;
      return (+r.score||0)-(+prev.score||0);
    }).filter(v=>v!=null);
    if(!diffs.length)return '<td></td>';
    const a=avg(diffs);
    const sign=a>0?'+':'';
    return `<td style="text-align:center;color:${a>0?'var(--green)':a<0?'#be185d':'inherit'}">${sign}${f1(a)}</td>`;
  }
  return '<td></td>';
}
function tlCompare(a,b,key){
  const va=tlSortVal(a,key),vb=tlSortVal(b,key);
  if(typeof va==='number'&&typeof vb==='number')return va-vb;
  return String(va).localeCompare(String(vb),'ko');
}
function tlHiddenCols(role){return (DB.testHiddenCols&&DB.testHiddenCols[role])||[];}
function toggleTestCol(role,key){
  DB.testHiddenCols=DB.testHiddenCols||{};
  DB.testHiddenCols[role]=DB.testHiddenCols[role]||[];
  const arr=DB.testHiddenCols[role];
  const idx=arr.indexOf(key);
  if(idx>=0)arr.splice(idx,1);else arr.push(key);
  save();render();
}

// 커서가 사라지거나 한글이 자모로 쪼개지는 문제가 있어, 한글 조합이 끝난 뒤/타이핑이 잠시 멈췄을 때만

function rerenderKeepFocus(){
  const el=document.activeElement;
  const id=el&&el.id;
  const selStart=el&&typeof el.selectionStart==='number'?el.selectionStart:null;
  const selEnd=el&&typeof el.selectionEnd==='number'?el.selectionEnd:null;
  render();
  if(id){
    const again=document.getElementById(id);
    if(again){
      again.focus();
      if(selStart!=null&&again.setSelectionRange){try{again.setSelectionRange(selStart,selEnd);}catch(e){}}
    }
  }
}

/* ═══════════ 구글폼 연동 (구글시트 공개 CSV 자동 불러오기 → 문항별 자동채점 → 테스트 이력관리 반영) ═══════════ */
// 취약영역 자동 분류 기준 — 우수 80점 이상 / 보통 60~79 / 보완필요 50~59 / 취약 50 미만
const WEAK_THRESHOLDS={excellent:80,normal:60,needsWork:50};
function weakLabel(score){
  if(score==null||isNaN(score))return null;
  if(score>=WEAK_THRESHOLDS.excellent)return{label:'우수',emoji:'🟢',color:'#0a7d43'};
  if(score>=WEAK_THRESHOLDS.normal)return{label:'보통',emoji:'🟡',color:'#a06b00'};
  if(score>=WEAK_THRESHOLDS.needsWork)return{label:'보완필요',emoji:'🟠',color:'#c2620a'};
  return{label:'취약',emoji:'🔴',color:'#be185d'};
}
// 아주 단순한 구분자 기반 표 파서 (따옴표/줄바꿈 포함 값 처리) — CSV(쉼표) 또는 엑셀 복사(탭) 모두 지원
function parseCSV(text,delim){
  delim=delim||',';
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===delim){row.push(field);field='';}
      else if(c==='\r'){/*skip*/}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(v=>v!==''));
}
// 붙여넣은 텍스트가 탭 구분(엑셀/구글시트에서 복사)인지 쉼표 구분(CSV)인지 자동 판별해서 파싱
function parsePastedTable(text){
  const firstLine=(text.split('\n')[0]||'');
  const delim=firstLine.includes('\t')?'\t':',';
  return parseCSV(text,delim);
}
// 구글폼 타임스탬프("2026. 7. 28 오전 10:12:33") 등을 YYYY-MM-DD로 변환 시도
function flNormDate(v){
  if(!v)return '';
  const m=String(v).match(/(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})/);
  if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  return v;
}

function flApplyHeader(header){
  const oldCols=FL_DRAFT.cols||[];
  FL_DRAFT.cols=header.map(h=>{
    const prev=oldCols.find(c=>c.header===h);
    if(prev)return prev;
    let kind='question';
    if(/타임스탬프|timestamp/i.test(h))kind='date';
    else if(/이름|성명/.test(h))kind='name';
    else if(/사번/.test(h))kind='empNo';
    else if(/팀|점포|매장|지점/.test(h))kind='store';
    return{header:h,kind,subject:'',subItem:'',answer:'',points:1};
  });
}
