function flLoadFromPaste(){
  const ta=document.getElementById('flPasteArea');
  const text=ta?ta.value:'';
  FL_DRAFT._pasteText=text;
  if(!text||!text.trim()){toast('붙여넣을 표 내용이 없습니다');return;}
  const rows=parsePastedTable(text);
  if(!rows.length){toast('표 내용을 인식하지 못했습니다 — 첫 줄에 열 제목이 포함되어 있는지 확인해주세요');return;}
  flApplyHeader(rows[0]);
  FL_DRAFT._rows=rows;
  toast(`열 ${rows[0].length}개를 읽어왔습니다 — 각 열의 역할을 지정해주세요`);
  renderFormLinkModal();
}
function flFileSelected(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result||'');
    const rows=parseCSV(text,',');
    if(!rows.length){toast('CSV 내용을 인식하지 못했습니다');return;}
    flApplyHeader(rows[0]);
    FL_DRAFT._rows=rows;
    FL_DRAFT._fileName=file.name;
    toast(`"${file.name}"에서 열 ${rows[0].length}개를 읽어왔습니다 — 각 열의 역할을 지정해주세요`);
    renderFormLinkModal();
  };
  reader.onerror=()=>toast('파일을 읽지 못했습니다');
  reader.readAsText(file,'UTF-8');
}
async function flLoadHeaders(){
  const urlEl=document.getElementById('flCsvUrl');
  if(urlEl)FL_DRAFT.csvUrl=urlEl.value.trim();
  if(!FL_DRAFT.csvUrl){toast('CSV 링크를 입력해주세요');return;}
  toast('열 정보를 불러오는 중...');
  try{
    const res=await fetch(FL_DRAFT.csvUrl);
    if(!res.ok)throw new Error('fetch failed');
    const text=await res.text();
    const rows=parseCSV(text,',');
    if(!rows.length)throw new Error('empty');
    flApplyHeader(rows[0]);
    FL_DRAFT._rows=rows; // 바로 이어서 "가져오기 실행"할 때 재요청하지 않도록 캐시
    toast(`열 ${rows[0].length}개를 불러왔습니다 — 각 열의 역할을 지정해주세요`);
    renderFormLinkModal();
  }catch(e){
    console.error(e);
    toast('CSV를 불러오지 못했습니다 — 링크가 "웹에 게시"된 공개 CSV 주소인지 확인해주세요');
  }
}
async function flImportRun(){
  if(!FL_DRAFT.cols.some(c=>c.kind==='question')){toast('채점(또는 응답 기록)할 문항 열을 1개 이상 지정해주세요');return;}
  if(!FL_DRAFT.cols.some(c=>c.kind==='name'||c.kind==='empNo')){toast('이름 또는 사번 열을 최소 1개 지정해주세요');return;}
  toast('응답을 불러와 채점하는 중...');
  try{
    let rows=FL_DRAFT._rows;
    if(!rows&&FL_DRAFT.source==='url'&&FL_DRAFT.csvUrl){
      const res=await fetch(FL_DRAFT.csvUrl);
      const text=await res.text();
      rows=parseCSV(text,',');
    }
    if(!rows){toast('먼저 "① 표 읽어오기/불러오기"로 응답을 불러와주세요');return;}
    const header=rows[0];
    const dataRows=rows.slice(1);
    const colIdx=FL_DRAFT.cols.map(c=>header.indexOf(c.header));
    let imported=0,skipped=0;
    DB.testRecords=DB.testRecords||[];
    dataRows.forEach(row=>{
      let person='',empNo='',store='',date='';
      const items=[];
      FL_DRAFT.cols.forEach((c,ci)=>{
        const idx=colIdx[ci];if(idx<0)return;
        const val=(row[idx]||'').trim();
        if(c.kind==='name')person=val;
        else if(c.kind==='empNo')empNo=val;
        else if(c.kind==='store')store=val;
        else if(c.kind==='date')date=val;
        else if(c.kind==='question'){
          const isCorrect=c.answer?(val.trim()===c.answer.trim()):null;
          items.push({q:c.header,subject:c.subject||'기타',subItem:c.subItem||'',answer:val,correctAnswer:c.answer||'',points:c.points??1,isCorrect});
        }
      });
      if(!person&&!empNo){skipped++;return;}
      const normDate=flNormDate(date)||new Date().toISOString().slice(0,10);
      // 같은 사번+응시일+테스트명으로 이미 가져온 기록이 있으면 재가져오기 시 중복 생성하지 않음
      const dup=empNo&&DB.testRecords.find(r=>r.role===TL_ROLE&&r.testName===TL_TEST&&r.empNo===empNo&&r.date===normDate);
      if(dup){skipped++;return;}
      const bySubj={};
      items.forEach(it=>{
        if(!bySubj[it.subject])bySubj[it.subject]={got:0,max:0};
        if(it.correctAnswer){bySubj[it.subject].max+=(it.points||1);if(it.isCorrect)bySubj[it.subject].got+=(it.points||1);}
      });
      const subjects=Object.keys(bySubj).map(name=>({name,score:bySubj[name].max?Math.round(bySubj[name].got/bySubj[name].max*100):''}));
      const totalGot=Object.values(bySubj).reduce((s,x)=>s+x.got,0);
      const totalMax=Object.values(bySubj).reduce((s,x)=>s+x.max,0);
      const score=totalMax?Math.round(totalGot/totalMax*100):'';
      const rec={id:'tr'+Date.now()+Math.random().toString(36).slice(2,7),role:TL_ROLE,testName:TL_TEST,
        person,empNo,store,tenure:'',date:normDate,
        score,passed:score!==''&&score>=(FL_DRAFT.passCutoff||60),memo:'',subjects,items,source:'form_import'};
      DB.testRecords.push(rec);
      sbUpsertTestRecord(rec);
      imported++;
    });
    DB.formLinks=(DB.formLinks||[]).filter(f=>f.id!==FL_DRAFT.id);
    const cfgToSave=Object.assign({},FL_DRAFT);delete cfgToSave._rows;delete cfgToSave._pasteText;delete cfgToSave._fileName;cfgToSave.updatedAt=new Date().toISOString();
    DB.formLinks.push(cfgToSave);
    sbUpsertFormLink(cfgToSave);
    save();closeModal();render();
    toast(`✅ ${imported}명 가져오기 완료${skipped?` (중복/이름·사번 없음 ${skipped}건 제외)`:''}`);
  }catch(e){
    console.error(e);
    toast('가져오기 중 오류가 발생했습니다');
  }
}
function flDeleteConfig(){
  if(!confirm('응답 가져오기 설정을 삭제할까요? (이미 가져온 테스트 결과는 그대로 남습니다)'))return;
  const cfg=flConfigFor(TL_ROLE,TL_TEST);
  DB.formLinks=(DB.formLinks||[]).filter(f=>!(f.role===TL_ROLE&&f.testName===TL_TEST));
  save();closeModal();toast('연동 설정이 삭제되었습니다');
  if(cfg)sbDeleteFormLink(cfg.id);
}

/* ── 개인별 문항 상세 + AI 개인 리포트 ── */
function viewRecordDetail(id){
  const rec=(DB.testRecords||[]).find(r=>r.id===id);if(!rec)return;
  renderRecordDetailModal(rec);
}
function renderRecordDetailModal(rec){
  const items=rec.items||[];
  const bySubj={};
  items.forEach(it=>{(bySubj[it.subject]=bySubj[it.subject]||[]).push(it);});
  const subjBlocks=Object.keys(bySubj).map(sn=>{
    const list=bySubj[sn];
    const correct=list.filter(x=>x.isCorrect===true).length;
    const graded=list.filter(x=>x.correctAnswer).length;
    const scorePct=graded?Math.round(correct/graded*100):null;
    const w=scorePct!=null?weakLabel(scorePct):null;
    return `<div style="margin-bottom:12px">
      <div style="font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${esc(sn)}
        ${w?`<span style="font-size:.75rem;font-weight:700;color:${w.color}">${w.emoji} ${w.label}${scorePct!=null?` (${scorePct}%)`:''}</span>`:''}</div>
      <div style="overflow-x:auto"><table class="tbl" style="margin-top:4px"><tbody>
      ${list.map(it=>`<tr>
        <td style="font-size:.78rem;max-width:260px">${esc(it.q)}${it.subItem?`<div class="card-sub" style="font-size:.72rem">${esc(it.subItem)}</div>`:''}</td>
        <td style="font-size:.78rem">${esc(it.answer)}</td>
        <td style="font-size:.78rem;text-align:center;white-space:nowrap">${it.isCorrect===true?'<span style="color:var(--green,#0a7d43)">✔ 정답</span>':it.isCorrect===false?'<span style="color:#be185d">✘ 오답</span>':'<span style="color:var(--ink4)">-</span>'}</td>
      </tr>`).join('')}
      </tbody></table></div>
    </div>`;
  }).join('')||'<div class="card-sub">문항별 상세 데이터가 없습니다 (구글폼 연동으로 가져온 응시자만 문항별 분석을 볼 수 있어요)</div>';

  const aiSection=items.length?renderAiReportSection(rec):'';
  const body=`<div style="max-height:62vh;overflow:auto">
    <div style="margin-bottom:10px"><b>${esc(rec.person||'-')}</b> <span class="card-sub">${esc(rec.testName||'')} · ${esc(rec.date||'')} · 총점 ${rec.score===''||rec.score==null?'-':rec.score}점</span></div>
    ${subjBlocks}
    ${aiSection}
  </div>`;
  openModal('📋 문항별 상세 · AI 개인 리포트',body,`<button class="btn" onclick="closeModal()">닫기</button>`);
}

async function runAiIndividualReport(id){
  const rec=(DB.testRecords||[]).find(r=>r.id===id);if(!rec)return;
  const box=document.getElementById('aiReportBox');
  if(box)box.innerHTML='<div class="card-sub">✨ AI 리포트 생성 중... 잠시만 기다려주세요</div>';
  const items=rec.items||[];
  const bySubj={};
  items.forEach(it=>{(bySubj[it.subject]=bySubj[it.subject]||[]).push(it);});
  const subjLines=Object.keys(bySubj).map(sn=>{
    const list=bySubj[sn];
    const correct=list.filter(x=>x.isCorrect===true).length;
    const graded=list.filter(x=>x.correctAnswer).length;
    const p=graded?Math.round(correct/graded*100):null;
    return `- ${sn}: ${p!=null?p+'%':'-'} (정답 ${correct}/${graded})`;
  }).join('\n');
  const wrongLines=items.filter(x=>x.isCorrect===false).map(x=>`- [${x.subject}${x.subItem?'/'+x.subItem:''}] ${x.q} → 응답:"${x.answer}" (정답:"${x.correctAnswer}")`).join('\n');
  const prompt=`다음은 GS더프레시 "${rec.testName}" 테스트에서 응시자 "${rec.person}"(${rec.role})의 결과입니다.
총점: ${rec.score}점

[과목별 점수]
${subjLines||'(과목별 데이터 없음)'}

[오답 문항]
${wrongLines||'(오답 없음)'}

위 내용을 바탕으로 개인 맞춤 학습 리포트를 아래 JSON 형식으로만 반환해주세요 (다른 텍스트 없이):
{
  "comprehensive":"종합평가 2~3문장",
  "strengths":"강점 2~3문장",
  "weakAreas":"취약영역 2~3문장",
  "itemAnalysis":"오답 문항을 근거로 한 구체적 취약점 분석 2~4문장",
  "recommendedTraining":"추천 교육/학습 방향 2~3문장",
  "priorityOrder":"학습 우선순위(과목·항목 순서로 나열)",
  "comment":"종합 코멘트 1~2문장"
}`;
  try{
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})}
    );
    const data=await res.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    const clean=text.replace(/```json|```/g,'').trim();
    const report=JSON.parse(clean);
    rec.aiReport=report;
    rec.aiReportAt=new Date().toISOString();
    save();
    sbUpsertTestRecord(rec);
    const box2=document.getElementById('aiReportBox');
    if(box2)box2.outerHTML=renderAiReportSection(rec);
    toast('✨ AI 개인 리포트가 생성되었습니다');
  }catch(e){
    console.error('AI 개인 리포트 오류:',e);
    const box2=document.getElementById('aiReportBox');
    if(box2)box2.innerHTML=`<div class="card" style="padding:14px;border:1px solid #be185d">
      <div style="color:#be185d;margin-bottom:8px">⚠ AI 리포트 생성에 실패했습니다. 잠시 후 다시 시도해주세요.</div>
      <button class="btn sm primary" onclick="runAiIndividualReport('${id}')">↻ 다시 시도</button></div>`;
  }
}
async function downloadAiReportPdf(id){
  const rec=(DB.testRecords||[]).find(r=>r.id===id);if(!rec||!rec.aiReport)return;
  const box=document.getElementById('aiReportBox');
  if(!box){toast('리포트를 먼저 열어주세요');return;}
  try{
    toast('📄 PDF 생성 중...');
    const canvas=await html2canvas(box,{scale:2,useCORS:true,logging:false,backgroundColor:'#fff'});
    const imgData=canvas.toDataURL('image/jpeg',0.95);
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pdfW=pdf.internal.pageSize.getWidth();
    const pdfH=pdf.internal.pageSize.getHeight();
    const ratio=pdfW/canvas.width;
    const totalH=canvas.height*ratio;
    let y=0;
    while(y<totalH){if(y>0)pdf.addPage();pdf.addImage(imgData,'JPEG',0,-y,pdfW,totalH);y+=pdfH;}
    pdf.save(`${rec.person||'응시자'}_${rec.testName||'테스트'}_AI리포트.pdf`);
    toast('✅ PDF 다운로드 완료');
  }catch(e){console.error(e);toast('PDF 생성 실패');}
}

function vTestLog(){
  DB.testRecords=DB.testRecords||[];
  if(!TESTLOG_ROLES.includes(TL_ROLE))TL_ROLE=TESTLOG_ROLES[0];

  const roleRecords=DB.testRecords.filter(r=>r.role===TL_ROLE);

  // 테스트명별로 그룹핑 (목록 화면·상세 화면 모두에서 사용)
  const byName={};
  roleRecords.forEach(r=>{
    const key=r.testName||'(이름 없음)';
    if(!byName[key])byName[key]=[];
    byName[key].push(r);
  });
  // 각 테스트의 가장 최근 응시일 기준으로 정렬 — 최근에 진행한 테스트가 맨 위
  const testNames=Object.keys(byName).sort((a,b)=>{
    const la=byName[a].reduce((m,r)=>(r.date||'')>m?(r.date||''):m,'');
    const lb=byName[b].reduce((m,r)=>(r.date||'')>m?(r.date||''):m,'');
    return la<lb?1:la>lb?-1:0;
  });
  if(TL_TEST&&!testNames.includes(TL_TEST))TL_TEST=null; // 직책 전환 등으로 선택했던 테스트가 사라진 경우

  const tabs=`<div class="row" style="gap:6px;margin-bottom:14px;flex-wrap:wrap">
    ${TESTLOG_ROLES.map(r=>{
      const cnt=DB.testRecords.filter(x=>x.role===r).length;
      const on=TL_ROLE===r;
      return `<button class="btn ${on?'primary':''} sm" onclick="TL_ROLE='${r}';TL_TEST=null;TL_Q='';rerender()">${esc(r)} <span style="opacity:.8">${cnt}</span></button>`;
    }).join('')}
    <span style="margin-left:auto"></span>
    <input class="input" id="tlSearchBox" style="max-width:220px" placeholder="${TL_TEST?'이름·사번·점포 검색':'테스트명 검색'}" value="${esc(TL_Q)}"
      oninput="tlSearchInput(this.value)"
      oncompositionstart="_tlComposing=true"
      oncompositionend="_tlComposing=false;tlSearchInput(this.value)">
    <button class="btn primary sm" onclick="${TL_INLINE_OPEN?'closeTlInline()':'openTlInline()'}">${TL_INLINE_OPEN?'✕ 입력 닫기':'＋ 테스트 결과 추가'}</button>
  </div>`;

  const inlinePanel=renderTlInlinePanel();

  if(!roleRecords.length){
    return tabs+inlinePanel+'<div class="empty">등록된 테스트 이력이 없습니다. "＋ 테스트 결과 추가"로 등록해주세요.</div>';
  }

  /* ── 1) 테스트를 아직 선택하지 않은 상태: 테스트명 목록만 최근 응시일순으로 보여줌 ── */
  if(!TL_TEST){
    const q=(TL_Q||'').trim();
    const shown=q?testNames.filter(n=>n.includes(q)):testNames;
    if(!shown.length){
      return tabs+inlinePanel+'<div class="empty">검색 결과가 없습니다.</div>';
    }
    const list=shown.map(name=>{
      const rows=byName[name];
      const n=rows.length,p=rows.filter(r=>r.passed).length;
      const avgS=avg(rows.map(r=>+r.score||0));
      const lastDate=rows.reduce((m,r)=>(r.date||'')>m?(r.date||''):m,'');
      const nameArg=JSON.stringify(name).replace(/"/g,'&quot;');
      return `<div class="card" style="margin-bottom:10px;cursor:pointer" onclick="TL_TEST=${nameArg};TL_Q='';TL_SORT={key:null,dir:1};render()">
        <div class="card-pad spread" style="flex-wrap:wrap;gap:10px">
          <div>
            <div class="card-title">${esc(name)}</div>
            <div class="card-sub">최근 응시일 ${esc(lastDate||'-')}</div>
          </div>
          <div class="row" style="gap:14px;font-size:.85rem;color:var(--ink2);flex-wrap:wrap">
            <span>응시 <b class="num">${n}</b>명</span>
            <span>합격률 <b class="num" style="color:var(--green)">${pct(n?p/n*100:0)}</b></span>
            <span>평균 <b class="num">${f1(avgS)}</b>점</span>
          </div>
        </div>
      </div>`;
    }).join('');
    return tabs+inlinePanel+list;
  }

  /* ── 2) 특정 테스트를 선택한 상태: 그 테스트만의 대쉬보드 + 개인별 성적 ── */
  const allRows=byName[TL_TEST]||[];
  const q=(TL_Q||'').trim();
  const filtered=q?allRows.filter(r=>(r.person||'').includes(q)||(r.store||'').includes(q)||(r.empNo||'').includes(q)):allRows;

  const totalN=allRows.length;
  const passN=allRows.filter(r=>r.passed).length;
  const avgScore=totalN?avg(allRows.map(r=>+r.score||0)):0;

  const nameArgTop=JSON.stringify(TL_TEST).replace(/"/g,'&quot;');
  const backBar=`<div class="row" style="margin-bottom:12px;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn sm" onclick="TL_TEST=null;TL_Q='';render()">← 테스트 목록으로</button>
    <div class="card-title" style="margin:0">${esc(TL_TEST)}</div>
    <button class="btn sm ghost" onclick="renameTestGroup('${TL_ROLE}',${nameArgTop})">✎ 이름 수정</button>
    <button class="btn sm ghost" onclick="exportTestCSV('${TL_ROLE}',${nameArgTop})">⬇ 엑셀(CSV) 내보내기</button>
    <button class="btn sm ${flConfigFor(TL_ROLE,TL_TEST)?'primary':'ghost'}" onclick="openFormLinkModal()">📥 응답 가져오기${flConfigFor(TL_ROLE,TL_TEST)?' 완료':''}</button>
  </div>`;

  const summary=`<div class="grid g3" style="margin-bottom:14px">
    ${kpi('응시 인원',totalN,'명','', 'flat')}
    ${kpi('합격률',totalN?Math.round(passN/totalN*100):'-',totalN?'%':'',totalN?`${passN}/${totalN}명 합격`:'응시 기록 없음','up')}
    ${kpi('평균 점수',totalN?f1(avgScore):'-',totalN?'점':'','','up')}
  </div>`;

  const hiddenCols=tlHiddenCols(TL_ROLE);
  const hiddenBar=hiddenCols.length?`<div class="card-sub" style="margin-bottom:12px">숨긴 열 — 클릭하면 다시 보여요:
    ${hiddenCols.map(k=>{const meta=TL_FIXED_COLS.find(c=>c.key===k);return `<span class="badge gray" style="margin-left:4px;cursor:pointer" onclick="toggleTestCol('${TL_ROLE}','${k}')">↺ ${esc(meta?meta.label.trim():k)}</span>`;}).join('')}
  </div>`:'';

  const visCols=TL_FIXED_COLS.filter(c=>!hiddenCols.includes(c.key));
  // 성명(응시자) 열은 항상 고정 표시 — 팀 열 바로 뒤에 위치하도록 앞/뒤로 나눔
  const colsBefore=visCols.filter(c=>c.key==='store');
  const colsAfter=visCols.filter(c=>c.key!=='store');

  const rows=filtered.slice().sort((a,b)=>TL_SORT.key?tlCompare(a,b,TL_SORT.key)*TL_SORT.dir:(a.date<b.date?1:-1));
  const subjNames=[];
  allRows.forEach(r=>(r.subjects||[]).forEach(s=>{if(!subjNames.includes(s.name))subjNames.push(s.name);}));
  const nameArg=JSON.stringify(TL_TEST).replace(/"/g,'&quot;');

  const table=!rows.length?'<div class="empty">검색 결과가 없습니다.</div>':`<div class="card" style="margin-bottom:14px">
      <div class="card-pad" style="border-bottom:1px solid var(--border)">
        <div class="spread">
          <div class="card-title">개인별 성적</div>
          <button class="btn sm" onclick="addGroupSubject('${TL_ROLE}',${nameArg})">＋ 과목</button>
        </div>
      </div>
      <div class="card-sub" style="padding:0 22px 8px">값은 표에서 바로 클릭해서 수정할 수 있고, 열 제목 옆 ✕로 필요 없는 열을 숨기거나 제목을 클릭해 정렬할 수 있어요.</div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr>
          ${colsBefore.map(c=>`<th style="${c.thStyle||''}"><span style="cursor:pointer" title="클릭하여 정렬" onclick="sortTestCol('${c.key}')">${esc(c.label.trim())}${tlSortArrow(c.key)}</span> <span style="cursor:pointer;color:var(--ink4)" title="'${esc(c.label.trim())}' 열 숨기기" onclick="toggleTestCol('${TL_ROLE}','${c.key}')">✕</span></th>`).join('')}
          <th><span style="cursor:pointer" title="클릭하여 정렬" onclick="sortTestCol('person')">성명${tlSortArrow('person')}</span></th>
          ${colsAfter.map(c=>`<th style="${c.thStyle||''}"><span style="cursor:pointer" title="클릭하여 정렬" onclick="sortTestCol('${c.key}')">${esc(c.label.trim())}${tlSortArrow(c.key)}</span> <span style="cursor:pointer;color:var(--ink4)" title="'${esc(c.label.trim())}' 열 숨기기" onclick="toggleTestCol('${TL_ROLE}','${c.key}')">✕</span></th>`).join('')}
          ${subjNames.map(sn=>{const sArg=JSON.stringify(sn).replace(/"/g,'&quot;');return `<th style="text-align:center;min-width:64px"><span style="cursor:pointer" title="클릭하여 정렬" onclick="sortTestCol(${sArg})">${esc(sn)}${tlSortArrow(sn)}</span> <span style="cursor:pointer;color:var(--ink4)" title="'${esc(sn)}' 과목 삭제" onclick="removeGroupSubject('${TL_ROLE}',${nameArg},${sArg})">✕</span></th>`;}).join('')}
          <th></th>
        </tr></thead>
        <tbody>${rows.map(r=>{
          const subjCell=sn=>{
            const f=(r.subjects||[]).find(s=>s.name===sn);
            const v=(f&&f.score!==''&&f.score!=null)?f.score:'';
            return `<td><input class="input num" style="padding:4px 6px;font-size:.78rem;width:52px;text-align:center" value="${esc(String(v))}" onchange="updateTestSubject('${r.id}',${JSON.stringify(sn).replace(/"/g,'&quot;')},this.value)"></td>`;
          };
          return `<tr>
          ${colsBefore.map(c=>c.cell(r)).join('')}
          <td style="font-weight:700;white-space:nowrap">${esc(r.person||'-')}</td>
          ${colsAfter.map(c=>c.cell(r)).join('')}
          ${subjNames.map(subjCell).join('')}
          <td style="white-space:nowrap">
            ${(r.items&&r.items.length)?`<button class="btn sm ghost" style="padding:3px 6px" title="문항별 상세·AI 리포트" onclick="viewRecordDetail('${r.id}')">📋</button>`:''}
            <button class="btn sm ghost" style="padding:3px 6px" onclick="openTestModal('${r.id}')">✎</button>
            <button class="btn sm ghost" style="padding:3px 6px" onclick="deleteTestRecord('${r.id}')">🗑</button>
          </td>
        </tr>`;}).join('')}</tbody>
        <tfoot><tr style="background:var(--bg2,rgba(127,127,127,.08));font-weight:800">
          ${colsBefore.map(c=>tlAvgFooterCell(c,rows)).join('')}
          <td style="white-space:nowrap">평균</td>
          ${colsAfter.map(c=>tlAvgFooterCell(c,rows)).join('')}

          <td></td>
        </tr></tfoot>
      </table></div>
    </div>`;

  return tabs+inlinePanel+backBar+summary+hiddenBar+table;
}

function updateTestField(id,field,value){
  const rec=DB.testRecords.find(r=>r.id===id);if(!rec)return;
  if(field==='score'){
    rec[field]=value===''?'':Math.max(0,Math.min(100,+value||0)); // 0~100 범위로 제한
  }else if(field==='passed'){
    rec.passed=(value==='1');
  }else{
    rec[field]=value;
  }
  save();sbUpsertTestRecord(rec);
  toast('저장되었습니다');
}
function updateTestSubject(id,name,value){
  const rec=DB.testRecords.find(r=>r.id===id);if(!rec)return;
  rec.subjects=rec.subjects||[];
  let s=rec.subjects.find(x=>x.name===name);
  if(!s){s={name,score:''};rec.subjects.push(s);}
  s.score=value===''?'':(+value||0);
  save();sbUpsertTestRecord(rec);
  toast('저장되었습니다');
}
function renameTestGroup(role,testName){
  const name=(prompt('테스트명 전체를 한 번에 수정합니다 (이 테스트에 속한 모든 인원에게 적용됩니다)',testName)||'').trim();
  if(!name||name===testName)return;
  const targets=DB.testRecords.filter(r=>r.role===role&&(r.testName||'(이름 없음)')===testName);
  if(!targets.length){toast('대상 기록이 없습니다');return;}
  targets.forEach(r=>{r.testName=name;sbUpsertTestRecord(r);});
  save();
  TL_TEST=name;
  render();
  toast(`${targets.length}건의 테스트명을 '${name}'(으)로 수정했습니다`);
}
function exportTestCSV(role,testName){
  const targets=DB.testRecords.filter(r=>r.role===role&&(r.testName||'(이름 없음)')===testName);
  if(!targets.length){toast('내보낼 데이터가 없습니다');return;}
  const subjNames=[];
  targets.forEach(r=>(r.subjects||[]).forEach(s=>{if(!subjNames.includes(s.name))subjNames.push(s.name);}));
  const header=['팀','성명','사번','근속','응시일','총점수',...subjNames,'전차수 대비','통과여부','비고'];
  const rows=[header,...targets.map(r=>{
    const subjVals=subjNames.map(sn=>{const s=(r.subjects||[]).find(x=>x.name===sn);return (s&&s.score!==''&&s.score!=null)?s.score:'';});
    const prev=tlPrevRecord(r.role,r.empNo,r.date,r.id);
    const delta=(!prev||prev.score===''||prev.score==null||r.score===''||r.score==null)?'':((+r.score||0)-(+prev.score||0));
    return [r.store||'',r.person||'',r.empNo||'',r.tenure||'',r.date||'',r.score??'',...subjVals,delta,r.passed?'합격':'불합격',r.memo||''];
  })];
  csv(rows,`테스트결과_${testName}.csv`);
}
function addGroupSubject(role,testName){
  const name=(prompt('추가할 과목명을 입력해주세요')||'').trim();
  if(!name)return;
  const targets=DB.testRecords.filter(r=>r.role===role&&(r.testName||'(이름 없음)')===testName);
  if(!targets.length){toast('대상 기록이 없습니다');return;}
  let added=0;
  targets.forEach(r=>{
    r.subjects=r.subjects||[];
    if(!r.subjects.find(s=>s.name===name)){r.subjects.push({name,score:''});sbUpsertTestRecord(r);added++;}
  });
  save();render();
  toast(added?`'${name}' 과목을 추가했습니다`:'이미 있는 과목명입니다');
}
function removeGroupSubject(role,testName,name){
  if(!confirm(`'${name}' 과목을 이 테스트의 모든 기록에서 삭제하시겠습니까?`))return;
  const targets=DB.testRecords.filter(r=>r.role===role&&(r.testName||'(이름 없음)')===testName);
  targets.forEach(r=>{
    if(r.subjects&&r.subjects.some(s=>s.name===name)){
      r.subjects=r.subjects.filter(s=>s.name!==name);
      sbUpsertTestRecord(r);
    }
  });
  save();render();
  toast(`'${name}' 과목을 삭제했습니다`);
}

function tlNormPass(v){
  const s=String(v??'').trim();
  if(/^(합격|통과|o|pass|y|true|1)$/i.test(s))return true;
  if(/^(불합격|x|fail|n|false|0)$/i.test(s))return false;
  return null;
}
function applyTestPaste(){
  const text=$('#tbPaste').value;
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length){toast('붙여넣을 내용이 없습니다');return;}
  const sep=lines[0].includes('\t')?'\t':',';
  // 엑셀에서 표를 복사하면 맨 끝에 의도치 않은 빈 열이 함께 붙는 경우가 있어, 헤더 끝의 빈 칸은 잘라낸다
  const trimTrailingEmpty=arr=>{const a=arr.slice();while(a.length&&a[a.length-1]==='')a.pop();return a;};
  const header=trimTrailingEmpty(lines[0].split(sep).map(c=>c.replace(/^["']|["']$/g,'').trim()));
  if(header.length<6){toast('열 개수를 확인해주세요 (팀·성명·사번·근속년수·총점수·과목...·통과여부 순서)');return;}

  // 마지막 열은 원래 통과여부이지만, 혹시 이름이 붙어있으면 이름으로도 한 번 더 확인
  let passIdx=header.length-1;
  const passByName=header.map((h,i)=>({h,i})).filter(x=>/통과|합격.?여부/.test(x.h));
  if(passByName.length)passIdx=passByName[passByName.length-1].i;
  // 백분율은 더 이상 쓰지 않지만, 예전 형식(백분율 열 포함)을 붙여넣어도 과목으로 잘못 섞이지 않도록 건너뜀
  const percentIdxs=new Set(header.map((h,i)=>({h,i})).filter(x=>/백분율|퍼센트/.test(x.h)).map(x=>x.i));
  const subjIdxs=[];
  for(let i=5;i<passIdx;i++){if(!percentIdxs.has(i))subjIdxs.push(i);}
  const subjects=subjIdxs.map(i=>header[i]);

  const rows=[];
  for(let i=1;i<lines.length;i++){
    let cols=lines[i].split(sep).map(c=>c.replace(/^["']|["']$/g,'').trim());
    cols=cols.slice(0,header.length); // 헤더 길이에 맞춰 자름 — 빈 열이 더 붙어와도 정렬이 어긋나지 않도록
    const person=cols[1]||'';
    if(!person)continue;
    const total=cols[4]??'';
    const passRaw=tlNormPass(cols[passIdx]);
    rows.push({team:cols[0]||'',person,empNo:cols[2]||'',tenure:cols[3]||'',total,
      scores:subjIdxs.map(idx=>cols[idx]??''),
      passed:passRaw===null?true:passRaw});
  }
  if(!rows.length){toast('인식된 행이 없습니다 — 첫 줄(헤더)을 포함해 붙여넣었는지 확인해주세요');return;}
  TL_BULK.subjects=subjects;
  TL_BULK.rows=rows;
  renderTlSubjectChips();renderTlRowsTable();
  toast(`${rows.length}행을 표에 반영했습니다 — 확인 후 저장을 눌러주세요`);
}

function saveTestBulk(){
  const role=$('#tbRole').value;
  const testName=$('#tbName').value.trim();
  const date=$('#tbDate').value||new Date().toISOString().slice(0,10);
  if(!testName){toast('테스트명을 입력해주세요');return;}
  const validRows=TL_BULK.rows.filter(r=>(r.person||'').trim());
  const skipped=TL_BULK.rows.length-validRows.length;
  if(!validRows.length){toast(skipped?`성명이 비어있어 ${skipped}개 행을 저장하지 못했습니다 — 성명을 입력해주세요`:'응시자가 있는 행이 없습니다');return;}
  DB.testRecords=DB.testRecords||[];
  const subjects=TL_BULK.subjects;
  const buildSubj=r=>subjects.map((name,si)=>({name,score:(r.scores&&r.scores[si]!==''&&r.scores[si]!=null)?(+r.scores[si]||0):''}));
  const newRecs=[];
  if(TL_BULK.mode==='edit'&&TL_BULK.editId){
    const rec=DB.testRecords.find(x=>x.id===TL_BULK.editId);
    const r=validRows[0];
    if(rec){
      Object.assign(rec,{role,testName,date,person:r.person.trim(),empNo:(r.empNo||'').trim(),
        store:(r.team||'').trim(),tenure:(r.tenure||'').trim(),
        score:r.total===''?'':Math.max(0,Math.min(100,+r.total||0)),
        passed:!!r.passed,subjects:buildSubj(r),memo:(r.memo||'').trim()});
      newRecs.push(rec);
    }
  }else{
    validRows.forEach((r,i)=>{
      const rec={id:'tl'+Date.now()+'_'+i,role,testName,date,
        person:r.person.trim(),empNo:(r.empNo||'').trim(),store:(r.team||'').trim(),tenure:(r.tenure||'').trim(),
        score:r.total===''?'':Math.max(0,Math.min(100,+r.total||0)),
        passed:!!r.passed,subjects:buildSubj(r),memo:(r.memo||'').trim()};
      DB.testRecords.push(rec);
      newRecs.push(rec);
    });
  }
  TL_ROLE=role;
  TL_TEST=testName; // 저장 직후 바로 그 테스트의 대쉬보드를 보여줌
  save();
  newRecs.forEach(sbUpsertTestRecord);
  TL_BULK=null;
  TL_INLINE_OPEN=false;
  closeModal();render();
  toast(`${newRecs.length}건 저장했습니다${skipped?` (성명 없는 ${skipped}행 제외)`:''}`);
}

function deleteTestRecord(id){

  DB.testRecords=(DB.testRecords||[]).filter(r=>r.id!==id);

}

let LT_TAB=null; // 선택된 탭 id
function ltTabs(){
  DB.linkTabs=DB.linkTabs||[];
  if(!DB.linkTabs.length)DB.linkTabs=[{id:'default',name:'기본',links:[],order:0}];
  // order가 없는(예전 데이터) 탭은 배열에 있는 순서 그대로 번호를 매겨줌
  let changed=false;
  DB.linkTabs.forEach((t,i)=>{if(t.order==null){t.order=i;changed=true;}});
  if(changed)save();
  return DB.linkTabs.slice().sort((a,b)=>(a.order??0)-(b.order??0));
}
function ltCurrentTab(){
  const tabs=ltTabs();
  if(!LT_TAB||!tabs.find(t=>t.id===LT_TAB))LT_TAB=tabs[0].id;
  return tabs.find(t=>t.id===LT_TAB);
}
function addLinkTab(){
  const name=(prompt('새 탭 이름을 입력해주세요')||'').trim();
  if(!name)return;
  const id='lt'+Date.now()+Math.random().toString(36).slice(2,6);
  const order=ltTabs().length;
  const tab={id,name,links:[],order};
  DB.linkTabs.push(tab);
  LT_TAB=id;
  save();render();
  sbUpsertLinkTab(tab);
}
function renameLinkTab(id){
  const tab=DB.linkTabs.find(t=>t.id===id);if(!tab)return;
  const name=(prompt('탭 이름 수정',tab.name)||'').trim();
  if(!name)return;
  tab.name=name;save();render();
  sbUpsertLinkTab(tab);
}
function deleteLinkTab(id){
  if(DB.linkTabs.length<=1){toast('탭은 최소 1개 있어야 합니다');return;}
  if(!confirm('이 탭과 안의 링크를 모두 삭제하시겠습니까?'))return;
  DB.linkTabs=DB.linkTabs.filter(t=>t.id!==id);
  DB.deletedLinkTabIds=DB.deletedLinkTabIds||[];
  if(!DB.deletedLinkTabIds.includes(id))DB.deletedLinkTabIds.push(id);
  if(LT_TAB===id)LT_TAB=DB.linkTabs[0].id;
  save();render();
  sbDeleteLinkTab(id);
  sbRecordDeletion('link_tab',id); // 다른 브라우저에서도 이 삭제를 알 수 있도록 서버에 기록
}
function moveLinkTab(id,dir){
  const tabs=ltTabs(); // order 기준 정렬된 목록
  const idx=tabs.findIndex(t=>t.id===id);
  const swapIdx=idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=tabs.length)return;
  const a=tabs[idx],b=tabs[swapIdx];
  const tmp=a.order;a.order=b.order;b.order=tmp;
  save();render();
  sbUpsertLinkTab(a);sbUpsertLinkTab(b);
}
function addLink(tabId){
  const tab=DB.linkTabs.find(t=>t.id===tabId);if(!tab)return;
  tab.links=tab.links||[];
  const order=tab.links.length;
  tab.links.push({id:'lk'+Date.now()+Math.random().toString(36).slice(2,6),title:'',url:'',order});
  save();render();
  sbUpsertLinkTab(tab);
}
function updateLink(tabId,linkId,field,value){
  const tab=DB.linkTabs.find(t=>t.id===tabId);if(!tab)return;
  const link=(tab.links||[]).find(l=>l.id===linkId);if(!link)return;
  link[field]=value;
  save();
  toast('저장되었습니다');
  sbUpsertLinkTab(tab);
}
function deleteLink(tabId,linkId){
  const tab=DB.linkTabs.find(t=>t.id===tabId);if(!tab)return;
  if(!confirm('이 링크를 삭제하시겠습니까?'))return;
  tab.links=(tab.links||[]).filter(l=>l.id!==linkId);
  save();render();
  sbUpsertLinkTab(tab);
}
function moveLink(tabId,linkId,dir){
  const tab=DB.linkTabs.find(t=>t.id===tabId);if(!tab)return;
  const links=(tab.links||[]).slice().sort((a,b)=>(a.order??0)-(b.order??0));
  links.forEach((l,i)=>{if(l.order==null)l.order=i;});
  const idx=links.findIndex(l=>l.id===linkId);
  const swapIdx=idx+dir;
  if(idx<0||swapIdx<0||swapIdx>=links.length)return;
  const tmp=links[idx].order;links[idx].order=links[swapIdx].order;links[swapIdx].order=tmp;
  save();render();
  sbUpsertLinkTab(tab);
}

    <div class="sv-title">응답이 마감되었습니다</div><div class="card-sub" style="margin-top:6px">${esc(t.name)} ${t.round}차 · 교육담당자에게 문의해주세요</div></div></div>`;return;}

    // 테스트 과목·설문 제외 항목은 빼고, 관리자가 추가한 문항은 포함
    const uniqueLects=surveyLectures(t);

    uniqueLects.forEach(L=>SV.lect[L.id]={expert:0,practical:0,good:'',improve:''});
  }
  const LIKERT_COLOR=['#e05252','#e0a832','#16a34a']; // 아쉬움/보통/만족

  const likert=(val,path)=>{
    const [lid,f]=path.split('.');
    return `<div class="likert">${LIKERT.map((lab,ix)=>{
      const sel=val===ix+1;

        style="${sel?`background:${LIKERT_COLOR[ix]};border-color:${LIKERT_COLOR[ix]};color:#fff`:''}"

  };
  $('#app').innerHTML=`
  <div class="progressbar"><i id="svProg" style="width:0%"></i></div>
  <div class="survey-wrap">
   <div class="survey-brand"><b>GS THE FRESH</b><div style="font-size:.78rem;color:var(--ink3)">교육만족도 설문</div></div>
   ${t.status!=='open'?'<div class="sv-card" style="border-color:var(--amber);color:var(--amber);font-size:.85rem;font-weight:700">⚠ 마감된 교육입니다 — 관리자 미리보기 모드</div>':''}
   <div class="sv-card">
    <div class="sv-section">교육정보</div>
    <div class="sv-title">${esc(t.name)}</div>
    <div class="sv-meta"><span class="badge gray">교육일 ${t.date}</span><span class="badge gray">${t.round}차</span>
     <span class="badge gray">${t.type}</span><span class="badge gray">${esc(t.place)}</span></div>
    <div class="card-sub" style="margin-top:10px">강의별 평가 후 마지막에 과정 전체 설문이 이어집니다. (약 3분 · 익명)</div>
   </div>
   ${(SV.lectures||surveyLectures(t)).map((L,ix,arr)=>{const v=SV.lect[L.id]||{expert:0,practical:0,good:'',improve:''};const label=lectLabel(t,L);
    return `<div class="sv-card">
     <div class="sv-section">강의평가 ${ix+1} / ${arr.length}</div>
     <div style="font-weight:800;font-size:1.02rem">${esc(label)}</div>
     <div class="sv-q">1. 강사의 전문성 및 전달력은 어떠하였나요? <span class="req">*</span></div>${likert(v.expert,L.id+'.expert')}
     <div class="sv-q">2. 교육 내용은 실무에 적용 가능한 내용을 포함하고 있나요? <span class="req">*</span></div>${likert(v.practical,L.id+'.practical')}
     <div class="sv-q">'${esc(label)}' 강의에 대해 <b>좋았던 점</b>을 작성하여 주세요.</div>
     <textarea class="input" rows="2" oninput="SV.lect['${L.id}'].good=this.value">${esc(v.good)}</textarea>
     <div class="sv-q">'${esc(label)}' 강의에 대해 <b>개선이 필요한 점</b>을 작성하여 주세요.</div>
     <textarea class="input" rows="2" oninput="SV.lect['${L.id}'].improve=this.value">${esc(v.improve)}</textarea>
    </div>`;}).join('')}
   <div class="sv-card"><div class="sv-section">과정 전체 설문</div>
    <div class="sv-q">추천하고 싶은 강의를 선정하여 주세요. (1개) <span class="req">*</span></div>
    ${(SV.lectures||surveyLectures(t)).map(L=>`<div class="opt ${SV.recommendLecture===L.id?'on':''}" onclick="SV.recommendLecture='${L.id}';prog();document.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));this.classList.add('on')">
      <span>${SV.recommendLecture===L.id?'◉':'○'}</span>${esc(L.title)}</div>`).join('')}
    <div class="sv-q">${esc(t.name)}에서 추가로 필요한(듣고 싶은) 강의 콘텐츠는 무엇인가요?</div>
    <textarea class="input" rows="2" oninput="SV.need=this.value">${esc(SV.need)}</textarea>
    <div class="sv-q">기타 교육관련 의견이 있으시면 자유롭게 기입하여 주세요.</div>
    <div class="card-sub" style="margin:-4px 0 6px">온라인/오프라인, 기타 교육에 대한 의견 모두 환영합니다. 여러분의 의견이 교육 개발에 큰 도움이 됩니다!</div>
    <textarea class="input" rows="3" oninput="SV.etc=this.value">${esc(SV.etc)}</textarea>
   </div>

   <div style="text-align:center;font-size:.75rem;color:var(--ink4);margin-top:12px">응답은 익명으로 수집되며 제출 즉시 대시보드에 반영됩니다</div>
  </div>`;
  prog();
}
function setLik(path,n){
  const [lid,f]=path.split('.');
  SV.lect[lid][f]=n;
  // 전체 재렌더 대신 버튼 상태만 업데이트
  const buttons=document.querySelectorAll(`[data-lect="${lid}"][data-field="${f}"]`);
  buttons.forEach((btn,i)=>{
    const sel=(i+1)===n;
    const COLORS=['#e05252','#e0a832','#16a34a'];
    btn.style.background=sel?COLORS[i]:'';
    btn.style.borderColor=sel?COLORS[i]:'';
    btn.style.color=sel?'#fff':'';
  });
  // 진행률 업데이트
  prog();
}
function prog(){
  const need=[...Object.values(SV.lect).flatMap(v=>[v.expert,v.practical]),SV.recommendLecture?1:0];
  const el=$('#svProg');if(el)el.style.width=Math.round(need.filter(Boolean).length/need.length*100)+'%';
}
async function submitSurvey(){
  if(Object.values(SV.lect).some(v=>!v.expert||!v.practical)){toast('모든 강의의 필수 평가를 선택해주세요');return;}
  if(!SV.recommendLecture){toast('추천하고 싶은 강의를 1개 선택해주세요');return;}
  const resp={id:'r'+Date.now(),trainingId:SV.tid,at:new Date().toISOString(),
    lect:SV.lect,recommendLecture:SV.recommendLecture,need:SV.need.trim(),etc:SV.etc.trim()};
  // localStorage 저장
  DB.responses.push(resp);
  delete DB.ai[SV.tid];save();
  // Supabase 저장

    await fetch('https://eldpjvlefuhyfacrmwsl.supabase.co/rest/v1/responses',{

      headers:{'Content-Type':'application/json','apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Prefer':'return=minimal'},
      body:JSON.stringify({
        id:resp.id,training_id:resp.trainingId,lect:resp.lect,
        recommend_lecture:resp.recommendLecture,need:resp.need,etc:resp.etc,
        submitted_at:resp.at
      })
    });
  }catch(e){
    console.warn('Supabase 저장 오류:',e);
    toast('⚠️ 서버 저장 실패 - 로컬에는 저장됨');
  }
  SV={};nav('#/done');
}

    <div class="sv-meta" style="margin-top:6px">
     <span class="badge gray">${t.date}</span>
     <span class="badge gray">${esc(t.place)}</span>
    </div>
    <p style="font-size:.85rem;color:var(--ink3);margin-top:10px">사번과 성명을 입력하고 출석 등록을 완료해 주세요.</p>
   </div>
   <div class="sv-card">
    <div class="sv-q">사번 <span class="req">*</span></div>

async function submitAttend(tid){
  const empNo=$('#atEmpNo').value.trim();
  const name=$('#atName').value.trim();
  if(!empNo||!name){toast('사번과 성명을 모두 입력해 주세요');return;}
  const t=byId(DB.trainings,tid);
  if(!t.checkins)t.checkins=[];
  // 중복 체크
  if(t.checkins.find(c=>c.empNo===empNo)){
    toast('이미 출석 등록된 사번입니다');return;
  }
  const checkin={empNo,name,at:new Date().toISOString()};
  t.checkins.push(checkin);
  save();
  // Supabase: training checkins 업데이트
  try{
    await fetch('https://eldpjvlefuhyfacrmwsl.supabase.co/rest/v1/trainings?id=eq.'+tid,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Prefer':'return=minimal'},
      body:JSON.stringify({checkins:t.checkins})
    });
  }catch(e){console.warn('출석 저장 오류:',e);}
  $('#app').innerHTML=`<div class="survey-wrap" style="padding-top:18vh"><div class="sv-card" style="text-align:center">
   <div style="font-size:2.8rem">✅</div>
   <div class="sv-title" style="margin-top:8px">출석이 완료되었습니다</div>
   <div style="font-size:1.1rem;font-weight:800;margin-top:6px;color:var(--green)">${esc(name)}</div>
   <div class="card-sub" style="margin-top:4px">사번 ${esc(empNo)}</div>
   <div class="card-sub" style="margin-top:12px">${esc(t.name)} ${t.round}차 · ${t.date}</div>

  </div></div>`;
}

   <div style="font-size:2.4rem;color:var(--green-b)">✓</div>

   ${session?'<button class="btn primary" style="margin-top:18px" onclick="nav(\'#/dash\')">관리자 대시보드로</button>':''}
