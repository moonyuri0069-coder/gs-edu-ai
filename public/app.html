<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS더프레시 AI 교육만족도 분석 시스템</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

/* ═══════════ 디자인 토큰 ═══════════ */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --surface2:#f0f2ef; --border:#e4e7e2;
  --ink:#141714; --ink2:#454b46; --ink3:#79807a; --ink4:#a4aaa4;
  --green:#0e5a34; --green-b:#16a34a; --green-soft:#e8f3ec; --green-line:#bfdccb;
  --amber:#b45309; --amber-soft:#fbf0df; --red:#b4433a; --red-soft:#f9e9e7;
  --shadow:0 1px 2px rgba(20,23,20,.05),0 4px 14px rgba(20,23,20,.05);
  --r:12px; --r-sm:8px;
  --star:#f2b01e; --star-off:#d8dcd7;
}
html[data-theme="dark"]{
  --bg:#131513; --surface:#1b1e1b; --surface2:#232723; --border:#2e332e;
  --ink:#eef1ee; --ink2:#c2c8c2; --ink3:#8b928b; --ink4:#5f665f;
  --green:#4cc07a; --green-b:#3db56c; --green-soft:#1c2b21; --green-line:#2c4534;
  --amber:#e0a04a; --amber-soft:#2e2517; --red:#e07a70; --red-soft:#301d1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --star:#e8b23c; --star-off:#3a403a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ═══════════ 레이아웃 셸 ═══════════ */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.logo{padding:22px 20px 16px;border-bottom:1px solid var(--border)}
.logo-main{font-size:1.06rem;font-weight:800;color:var(--green);letter-spacing:.02em}
.logo-sub{font-size:.72rem;color:var(--ink3);margin-top:2px;font-weight:600}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);
  color:var(--ink2);font-size:.93rem;font-weight:500;cursor:pointer;border-left:3px solid transparent;
}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--green-soft);color:var(--green);border-left-color:var(--green-b);font-weight:700}
.nav-item svg{width:17px;height:17px;flex:0 0 auto}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);font-size:.78rem;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:60px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:20;
}
.page-title{font-size:1.05rem;font-weight:800}
.page-sub{font-size:.8rem;color:var(--ink3)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:24px 26px 60px;max-width:1240px;width:100%;margin:0 auto}

/* ═══════════ 공통 컴포넌트 ═══════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card-title{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
.card-sub{font-size:.8rem;color:var(--ink3);margin-top:2px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font-size:.88rem;font-weight:600;transition:background .12s;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--ink3)}
.btn.sm{padding:6px 11px;font-size:.8rem}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.gray{background:var(--surface2);color:var(--ink3)}
.input,.select,textarea.input{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);outline:none;transition:border-color .12s;
}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--green-b)}
label.fld{display:block;font-size:.8rem;font-weight:700;color:var(--ink2);margin:0 0 5px}
.fld-group{margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{
  text-align:left;font-size:.76rem;color:var(--ink3);font-weight:700;
  padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);
}
.tbl th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.tbl th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.tbl td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover td{background:var(--surface2);cursor:pointer}
.empty{padding:44px 20px;text-align:center;color:var(--ink3);font-size:.9rem}
.kpi-label{font-size:.8rem;color:var(--ink3);font-weight:700}
.kpi-value{font-size:1.9rem;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi-value small{font-size:.95rem;color:var(--ink3);font-weight:700;margin-left:2px}
.kpi-sub{font-size:.78rem;margin-top:4px;font-weight:600}
.up{color:var(--green-b)} .down{color:var(--red)} .flat{color:var(--ink3)}
.divider{height:1px;background:var(--border);margin:16px 0}
.chip{display:inline-flex;padding:5px 12px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);font-size:.8rem;font-weight:600;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;
  font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,10,.45);display:none;
  align-items:flex-start;justify-content:center;z-index:50;padding:6vh 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:560px;
  border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);font-weight:800;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.x{border:none;background:none;font-size:1.15rem;color:var(--ink3);cursor:pointer}

/* 별점 */
.stars{display:inline-flex;gap:3px}
.stars button{border:none;background:none;font-size:1.55rem;line-height:1;color:var(--star-off);padding:2px;transition:transform .08s}
.stars button.on{color:var(--star)}
.stars button:hover{transform:scale(1.12)}
.stars.ro button{cursor:default;font-size:1rem;padding:0}
.stars.ro button:hover{transform:none}
.star-val{font-weight:800;font-size:.92rem;margin-left:6px}

/* 워드클라우드 */
.cloud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:18px 8px}
.cloud span{font-weight:800;line-height:1.2}

/* AI Summary 시그니처 카드 */
.ai-card{position:relative;overflow:hidden}
.ai-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--green-b),var(--green))}
.ai-eyebrow{font-size:.78rem;font-weight:800;color:var(--green);letter-spacing:.04em}
.ai-headline{font-size:1.18rem;font-weight:800;margin:6px 0 8px;letter-spacing:-.01em}
.gauge{height:10px;border-radius:99px;background:var(--red-soft);overflow:hidden;display:flex}
.gauge>i{display:block;height:100%;background:var(--green-b);border-radius:99px 0 0 99px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* 설문(참여자) */
.survey-wrap{max-width:680px;margin:0 auto;padding:34px 18px 80px}
.survey-brand{text-align:center;margin-bottom:18px}
.survey-brand b{color:var(--green);font-size:1.05rem;font-weight:800}
.sv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:24px 26px;margin-bottom:16px}
.sv-title{font-size:1.28rem;font-weight:800;letter-spacing:-.01em}
.sv-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sv-q{font-weight:700;font-size:.95rem;margin:18px 0 8px}
.sv-q .req{color:var(--red)}
.sv-section{font-size:.8rem;font-weight:800;color:var(--green);letter-spacing:.05em;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);
  border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;font-size:.92rem}
.opt.on{border-color:var(--green-b);background:var(--green-soft);font-weight:700}
.progressbar{position:sticky;top:0;height:4px;background:var(--border);z-index:5}
.progressbar>i{display:block;height:100%;background:var(--green-b);transition:width .2s}

/* 리커트 선택 */
.likert{display:flex;gap:6px;flex-wrap:wrap}
.likert button{flex:1;min-width:90px;padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);font-size:.9rem;font-weight:700;color:var(--ink2);transition:.1s;letter-spacing:.02em}
.likert button.on{border-color:var(--green-b);background:var(--green-soft);color:var(--green);font-weight:800}
/* QR */
.qrbox{display:flex;gap:18px;align-items:center}
.qrbox canvas{border:1px solid var(--border);border-radius:var(--r-sm);background:#fff}

/* 로그인 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px}

/* 임원보고 (A4) */
.agenda-a4{
  background:#fff;color:#141714;width:794px;margin:0 auto;
  padding:32px 36px 40px;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:4px;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
.ag-title{font-size:1.25rem;font-weight:900;letter-spacing:-.02em;text-align:center;
  padding:10px 0 8px;border-bottom:2.5px solid #0e5a34;margin-bottom:10px;color:#0e5a34}
.ag-head{font-size:.84rem;background:#f0f4f1;border-left:4px solid #0e5a34;
  padding:7px 14px;margin-bottom:14px;color:#1a2e1a;font-weight:600;line-height:1.5;border-radius:0 4px 4px 0}
.ag-info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ag-info-box{border:1.5px solid #cdd8cb;border-radius:6px;overflow:hidden}
.ag-info-label{background:#0e5a34;color:#fff;font-size:.72rem;font-weight:800;
  padding:4px 10px;letter-spacing:.04em;text-align:center}
.ag-info-val{padding:7px 10px;font-size:.82rem;font-weight:700;text-align:center;min-height:36px;
  display:flex;align-items:center;justify-content:center}
.ag-section-title{font-size:.82rem;font-weight:900;color:#0e5a34;
  border-bottom:1.5px solid #0e5a34;padding-bottom:4px;margin-bottom:8px;letter-spacing:.03em}
.ag-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:6px}
.ag-table th{background:#0e5a34;color:#fff;padding:5px 10px;font-weight:800;text-align:center!important}
.ag-table td{padding:5px 10px;border:1px solid #e4e7e2;line-height:1.4}
.ag-table tr:nth-child(even) td{background:#f8faf7}
.ag-footer{margin-top:16px;text-align:right;font-size:.72rem;color:#aaa;border-top:1px solid #eee;padding-top:8px}
@media print{
  .print-agenda .side,.print-agenda .topbar,.print-agenda .card,.print-agenda .content>*:not(#agendaDoc){display:none!important}
  .print-agenda .agenda-a4{box-shadow:none!important;border:none!important;width:100%!important;padding:16px!important}
}
.report-a4{
  background:#fff;color:#141714;width:794px;margin:0 auto;
  padding:28px 32px 36px;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:4px;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
/* 1페이지 */
.rp-p1-title{font-size:1.3rem;font-weight:900;letter-spacing:-.02em;margin-bottom:7px}
.rp-subtitle{font-size:.82rem;background:#f0f4f1;border-left:4px solid #0e5a34;
  padding:7px 12px;margin-bottom:10px;color:#1a2e1a;font-weight:600;line-height:1.45}
.rp-three{display:grid;grid-template-columns:1.15fr .85fr 1fr;gap:10px;margin-bottom:8px}
.rp-section-box{border:1.5px solid #cdd8cb;border-radius:8px;overflow:hidden}
.rp-section-head{background:#0e5a34;color:#fff;font-size:.78rem;font-weight:800;
  padding:5px 10px;letter-spacing:.04em;text-align:center}
.rp-section-body{padding:8px 10px;font-size:.78rem;background:#fff}
.rp-sched{width:100%;border-collapse:collapse;font-size:.72rem}
.rp-sched th{background:#e8f2ec;font-weight:800;padding:3px 6px;border:1px solid #cdd8cb;text-align:center!important;color:#0e5a34}
.rp-sched td{padding:3px 6px;border:1px solid #e4e7e2;vertical-align:top;line-height:1.3}
.rp-sched .lunch{background:#fafafa;color:#999;text-align:center;font-style:italic}
.rp-att{width:100%;border-collapse:collapse;font-size:.72rem}
.rp-att th{background:#e8f2ec;font-weight:800;padding:3px 6px;border:1px solid #cdd8cb;text-align:center!important;color:#0e5a34}
.rp-att td{padding:3px 6px;border:1px solid #e4e7e2;text-align:center}
.rp-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.rp-photo-ph{background:#f0f4f1;border-radius:4px;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#aaa;border:1px dashed #cdd8cb}
/* 페이지 구분선 */
.rp-two-top{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;margin-bottom:8px}
.rp-photos-full{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}
.rp-photo-ph-sm{background:#f0f4f1;border-radius:4px;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#aaa;border:1px dashed #cdd8cb}
.rp-page-break{border:none;border-top:2px dashed #e4e7e2;margin:16px 0;position:relative}
.rp-page-break::after{content:'- 1/2 -';position:absolute;right:0;top:-10px;
  font-size:.72rem;color:#aaa;background:#fff;padding:0 6px}
/* 2페이지 */
.rp-p2-title{font-size:1.05rem;font-weight:900;margin-bottom:8px;letter-spacing:-.01em;
  border-bottom:2.5px solid #0e5a34;padding-bottom:6px}
.rp-two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.rp-sec{font-size:.75rem;font-weight:800;color:#fff;background:#0e5a34;
  padding:3px 10px;border-radius:4px;margin-bottom:6px;letter-spacing:.03em;display:inline-block}
.rp-opinion-table{width:100%;border-collapse:collapse;font-size:.74rem}
.rp-opinion-table th{background:#e8f2ec;color:#0e5a34;font-weight:800;padding:4px 8px;
  border:1px solid #cdd8cb;text-align:center!important}
.rp-opinion-table td{padding:4px 8px;border:1px solid #e4e7e2;vertical-align:top;line-height:1.4}
.rp-opinion-table td.lname{font-weight:700;color:#0e5a34;white-space:nowrap;font-size:.72rem}
.rp-opinion-table ul{margin:0;padding-left:12px}
.rp-opinion-table li{margin-bottom:2px}
.rp-opinion-table li.hi{color:#0e5a34;font-weight:700}
/* 추천 강의 바 차트 */
.rec-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:.74rem}
.rec-bar-label{width:130px;flex:0 0 auto;font-weight:600;color:#333;line-height:1.3}
.rec-bar-track{flex:1;background:#eef2ee;border-radius:4px;height:14px;overflow:hidden}
.rec-bar-fill{height:100%;background:#16a34a;border-radius:4px;transition:.3s}
.rec-bar-fill.best{background:#0e5a34}
.rec-bar-num{width:28px;text-align:right;font-weight:800;color:#0e5a34}
/* 비용표 */
.rp-cost{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:4px}
.rp-cost th{background:#e8f2ec;color:#0e5a34;font-weight:800;padding:4px 8px;
  border:1px solid #cdd8cb;text-align:center}
.rp-cost td{padding:4px 8px;border:1px solid #e4e7e2;text-align:right}
.rp-cost td.lbl{text-align:center;font-weight:700;font-size:.73rem}
.rp-cost tr.total td{font-weight:800;background:#f0f4f1}
.rp-cost .minus{color:#1a7a40}
.rp-cost .plus{color:#b4433a}
/* 필요 강의/기타 */
.rp-needs{font-size:.74rem;line-height:1.6;color:#2c322d;
  background:#f8f9f7;border:1px solid #e0e8de;border-radius:6px;padding:7px 10px}
/* KPI 배지 행 */
.rp-kpi-row{display:flex;gap:6px;margin:8px 0}
.rp-kpi-badge{flex:1;border:1.5px solid #cdd8cb;border-radius:6px;padding:5px 6px;text-align:center}
.rp-kpi-badge .k-val{font-size:1.05rem;font-weight:900;color:#0e5a34}
.rp-kpi-badge .k-lbl{font-size:.65rem;color:#79807a;font-weight:700}
/* AI 종합 */
.rp-ai-box{background:#f0f4f1;border-left:4px solid #16a34a;border-radius:0 6px 6px 0;
  padding:7px 10px;font-size:.76rem;line-height:1.55;color:#1a2e1a}
/* 페이지2 끝 표기 */
.rp-page-end{text-align:center;color:#aaa;font-size:.72rem;margin-top:18px}

@media print{
  body{background:#fff}
  body.print-report *{visibility:hidden}
  body.print-report .report-a4,body.print-report .report-a4 *{visibility:visible}
  body.print-report .agenda-a4{
  background:#fff;color:#141714;width:794px;margin:0 auto;
  padding:32px 36px 40px;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:4px;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
.ag-title{font-size:1.25rem;font-weight:900;letter-spacing:-.02em;text-align:center;
  padding:10px 0 8px;border-bottom:2.5px solid #0e5a34;margin-bottom:10px;color:#0e5a34}
.ag-head{font-size:.84rem;background:#f0f4f1;border-left:4px solid #0e5a34;
  padding:7px 14px;margin-bottom:14px;color:#1a2e1a;font-weight:600;line-height:1.5;border-radius:0 4px 4px 0}
.ag-info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ag-info-box{border:1.5px solid #cdd8cb;border-radius:6px;overflow:hidden}
.ag-info-label{background:#0e5a34;color:#fff;font-size:.72rem;font-weight:800;
  padding:4px 10px;letter-spacing:.04em;text-align:center}
.ag-info-val{padding:7px 10px;font-size:.82rem;font-weight:700;text-align:center;min-height:36px;

let DB;
function load(){

    }else{
      DB={trainings:[],instructors:[],responses:[],ai:{},theme:'light'};
    }
  }catch(e){
    DB={trainings:[],instructors:[],responses:[],ai:{},theme:'light'};
  }
  save();
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const pct=n=>Math.round(n)+'%';
const byId=(arr,id)=>arr.find(x=>x.id===id);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function respOf(tid){return DB.responses.filter(r=>r.trainingId===tid);}
function lectOf(t,lid){return t.lectures.find(l=>l.id===lid);}
function lectLabel(t,L){const ins=byId(DB.instructors,L.instructorId);return `${L.title} - ${ins?ins.name:''}`;}
function respAvg(r){return avg(Object.values(r.lect).flatMap(v=>[toScore(v.expert),toScore(v.practical)]));}
function trainingAvg(tid){const rs=respOf(tid);return rs.length?avg(rs.map(respAvg)):0;}
function trainingRate(t){const n=respOf(t.id).length;return t.invited?Math.min(100,n/t.invited*100):0;}
function lectureAvg(tid,lid){const vs=respOf(tid).map(r=>r.lect[lid]).filter(Boolean);
  return {expert:avg(vs.map(v=>v.expert)),practical:avg(vs.map(v=>v.practical)),
    total:avg(vs.flatMap(v=>[v.expert,v.practical])),n:vs.length};}
function instructorStat(iid,fromD,toD){
  let ex=[],pr=[],n=0;const perT={};
  // 같은 날짜 강의는 1회로 카운트 (중복 제거)
  const countedDates=new Set();
  DB.trainings.forEach(t=>{
    if(fromD&&t.date<fromD)return;
    if(toD&&t.date>toD)return;
    // 첫번째/마지막 강의 제외한 실제 강의 목록
    const evalLects=t.lectures.filter((_,i,arr)=>i>0&&i<arr.length-1);
    const hasLect=evalLects.some(L=>L.instructorId===iid);
    if(!hasLect)return;
    if(!countedDates.has(t.date)){countedDates.add(t.date);n++;}
    evalLects.forEach(L=>{if(L.instructorId!==iid)return;
      respOf(t.id).forEach(r=>{const v=r.lect[L.id];if(!v)return;ex.push(toScore(v.expert));pr.push(toScore(v.practical));
        (perT[t.id]=perT[t.id]||[]).push((v.expert+v.practical)/2);});});});
  const ins=byId(DB.instructors,iid);
  const finalN=(ins&&ins.manualCount!==undefined)?ins.manualCount:n;
  return {n:finalN,expert:avg(ex),practical:avg(pr),avg:avg([...ex,...pr]),perT};
}

const KW_POS=[['디테일한 설명',/디테일|자세|세세/],['쉬운 전달',/쉽|이해하기|간략|간결/],['실무 적용성',/실무|현장|점포에 적용|바로 쓸/],
 ['사례·예시',/사례|예시/],['질의응답',/질문|답변|들어주/],['방향성 공유',/방향|계획|전략.*공유|흐름/],['전문성',/전문성|노하우/],['새로운 지식',/몰랐|새로운|알게|배움|배웠/]];
const KW_IMP=[['교육시간 확대',/시간(이|을)?.*(짧|부족)|깊이가 (얕|얇)/],['질의응답 시간',/질문.*시간|질의응답.*부족/],
 ['진행 속도 조절',/속도/],['실습 확대',/실습/],['사전 자료 공유',/미리 공유|사전/],['교육 깊이 강화',/깊이/]];
function analyze(tid){
  const rs=respOf(tid);if(!rs.length)return null;
  const t=byId(DB.trainings,tid);
  const goods=[],imps=[],etcs=[];
  rs.forEach(r=>{Object.values(r.lect).forEach(v=>{
    if(v.good&&!/^없|^무$|^특이|^\.$|^\s*$/.test(v.good))goods.push(v.good);
    if(v.improve&&!/^없|^무$|^특이|^\.$|^\s*$/.test(v.improve))imps.push(v.improve);});
    if(r.etc&&!/^없/.test(r.etc))etcs.push(r.etc);if(r.need&&!/^없/.test(r.need))etcs.push(r.need);});
  const count=(pool,dict)=>{const m={};pool.forEach(s=>dict.forEach(([k,re])=>{if(re.test(s))m[k]=(m[k]||0)+1;}));
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const topPos=count(goods,KW_POS).slice(0,5),topImp=count(imps,KW_IMP).slice(0,5);
  const nOp=goods.length+imps.length+etcs.length;
  const posRate=nOp?(goods.length+etcs.filter(s=>/감사|만족|기대|좋/.test(s)).length)/nOp*100:0;
  // 추천 강의 집계
  const recCnt={};rs.forEach(r=>{if(r.recommendLecture)recCnt[r.recommendLecture]=(recCnt[r.recommendLecture]||0)+1;});
  const recTop=Object.entries(recCnt).sort((a,b)=>b[1]-a[1]);
  const bestL=recTop[0]?lectOf(t,recTop[0][0]):null;
  const kw=[...topPos.map(([k,c])=>({k,c,pos:1})),...topImp.map(([k,c])=>({k,c,pos:0}))].sort((a,b)=>b.c-a.c);
  const p1=topPos[0]?.[0]||'강의 내용',p2=topPos[1]?.[0]||'강사 전문성';
  const i1=topImp[0]?.[0]||'교육시간 확대';
  const summary=`이번 「${t.name} ${t.round}차」는 ${p1}, ${p2} 항목에서 높은 평가를 받았습니다(강의 평균 ${f1(trainingAvg(tid))}점).`
   +(bestL?` 추천 강의 1위는 「${bestL.title}」(${recTop[0][1]}표)입니다.`:'')
   +(topImp.length?` 반면 ${i1}에 대한 의견이 확인되어 과정 설계 시 보완이 필요합니다.`:' 개선 의견은 특이사항이 없습니다.')
   +` 전체 의견 ${nOp}건 중 긍정 비율은 ${pct(posRate)}입니다.`;
  const plan=`${p1} 중심의 강의 구성은 높은 만족도를 보였습니다. `
   +(topImp.length?`다만 ${topImp.map(x=>x[0]).slice(0,2).join('과 ')} 요구가 반복되어, 향후 차수에서는 강의당 시간을 확대하고 질의응답 세션을 별도 편성하는 것을 권장합니다.`
   :'현행 구성을 유지하되 추천 상위 강의를 차기 과정의 핵심 트랙으로 확대 편성하는 것을 권장합니다.');
  const res={topPos,topImp,keywords:kw,posRate,negRate:100-posRate,nOpinions:nOp,summary,plan,
    recTop,goods:goods.slice(0,60),imps:imps.slice(0,60),analyzedAt:new Date().toISOString()};
  DB.ai[tid]=res;save();return res;
}

function chLine(labels,vals,{w=520,h=200,min=1,max=5,color='var(--green-b)'}={}){
  const px=44,py=18,gw=w-px-14,gh=h-py-34,n=vals.length;
  const X=i=>px+gw*(n>1?i/(n-1):0),Y=v=>py+gh*(1-(v-min)/(max-min));
  let grid='',pts='',dots='',lbl='';
  for(let g=min;g<=max;g+=0.5){const y=Y(g);grid+=`<line x1="${px}" y1="${y}" x2="${w-10}" y2="${y}" stroke="var(--border)"/><text x="${px-8}" y="${y+4}" font-size="10" fill="var(--ink3)" text-anchor="end">${g.toFixed(1)}</text>`;}
  vals.forEach((v,i)=>{pts+=`${X(i)},${Y(v)} `;dots+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
    lbl+=`<text x="${X(i)}" y="${h-8}" font-size="10.5" fill="var(--ink3)" text-anchor="middle">${labels[i]}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">${grid}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}
function chBars(labels,vals,{w=520,h=210,max=5,color='var(--green-b)',fmt=f1}={}){
  const px=14,gh=h-52,n=vals.length,bw=Math.min(46,(w-px*2)/n*0.55);let out='';
  vals.forEach((v,i)=>{const cx=px+(w-px*2)*(i+0.5)/n,bh=gh*(v/max);
    out+=`<rect x="${cx-bw/2}" y="${18+gh-bh}" width="${bw}" height="${Math.max(2,bh)}" rx="6" fill="${color}"/>
    <text x="${cx}" y="${12+gh-bh}" font-size="11" font-weight="800" fill="var(--ink2)" text-anchor="middle">${fmt(v)}</text>
    <text x="${cx}" y="${h-8}" font-size="10.5" fill="var(--ink3)" text-anchor="middle">${esc(labels[i])}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%"><line x1="${px}" y1="${18+gh}" x2="${w-px}" y2="${18+gh}" stroke="var(--border)"/>${out}</svg>`;
}
function chHBars(labels,vals,{w=520,max=5,color='var(--green-b)',fmt=f1,lw=150}={}){
  const rh=34,h=vals.length*rh+8;let out='';
  vals.forEach((v,i)=>{const y=6+i*rh,bw=(w-lw-64)*(v/max);
    out+=`<text x="${lw-10}" y="${y+16}" font-size="12" fill="var(--ink2)" font-weight="600" text-anchor="end">${esc(labels[i])}</text>
    <rect x="${lw}" y="${y+4}" width="${w-lw-64}" height="16" rx="8" fill="var(--surface2)"/>
    <rect x="${lw}" y="${y+4}" width="${Math.max(3,bw)}" height="16" rx="8" fill="${color}"/>
    <text x="${lw+bw+8}" y="${y+17}" font-size="11.5" font-weight="800" fill="var(--ink2)">${fmt(v)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">${out}</svg>`;
}
function chDonut(val,{size=150,color='var(--green-b)',label=''}={}){
  const r=56,c=2*Math.PI*r,off=c*(1-val/100);
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%">
   <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="14"/>
   <circle cx="75" cy="75" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
     stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 75 75)"/>
   <text x="75" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${pct(val)}</text>
   <text x="75" y="94" text-anchor="middle" font-size="10.5" fill="var(--ink3)" font-weight="700">${label}</text></svg>`;
}
function drawQR(canvas,text){
  // canvas를 img 태그로 교체하여 QR 표시
  const size=canvas.width||200;
  const apiUrl='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text)+'&margin=10&format=png';
  // canvas 부모에 img 삽입
  const img=document.createElement('img');
  img.src=apiUrl;
  img.width=size;img.height=size;
  img.style.cssText='display:block;border-radius:4px';
  img.onerror=()=>{
    // API 실패 시 URL 텍스트로 대체
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#f0f4f1';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#0e5a34';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('QR 로드 실패',size/2,size/2-10);
    ctx.fillText('URL을 직접 사용하세요',size/2,size/2+10);
  };
  if(canvas.parentNode){
    canvas.style.display='none';
    // 기존 img 있으면 제거
    const old=canvas.parentNode.querySelector('img.qr-img');
    if(old)old.remove();
    img.classList.add('qr-img');
    canvas.parentNode.insertBefore(img,canvas);
  }
}
function csv(rows,name){

  URL.revokeObjectURL(a.href);toast(name+' 다운로드 완료');
}

async function saveEditTraining(tid){
  const t=byId(DB.trainings,tid);
  if(!t)return;
  const name=$('#fName').value.trim(),date=$('#fDate').value;
  if(!name||!date){toast('교육명과 교육일을 입력해주세요');return;}
  const lectures=LECT_DRAFT.filter(L=>L.title.trim()).map((L,i)=>{
    let iid=L.instructorId;
    const iname=(L.instructorName||'').trim();
    if(!iid&&iname){
      const existing=DB.instructors.find(x=>x.name===iname);
      if(existing){iid=existing.id;}
      else{iid='i'+Date.now()+'_'+i;DB.instructors.push({id:iid,name:iname,field:'',bio:''});sbUpsert('instructors',{id:iid,name:iname,field:'',bio:''});}
    }
    // 강사 field 업데이트
    if(iid&&L.field){const ins=byId(DB.instructors,iid);if(ins&&!ins.field)ins.field=L.field;}
    return {id:L.id||'L'+i,title:L.title.trim(),slot:L.slot||'',instructorId:iid||'',instructorName:iname,field:L.field||''};
  });
  t.name=name;t.date=date;t.round=+$('#fRound').value||1;
  t.type=$('#fType').value;t.place=$('#fPlace').value.trim()||'미정';
  t.invited=+$('#fInvited').value||15;t.lectures=lectures;
  t.attendees=ATT_DRAFT.filter(a=>a.name.trim());
  save();
  await sbUpsert('trainings',{id:tid,name:t.name,date:t.date,round:t.round,
    type:t.type,place:t.place,invited:t.invited,lectures:t.lectures,
    attendees:t.attendees,status:t.status,budget:t.budget||[],checkins:t.checkins||[]});
  closeModal();render();toast('교육이 수정되었습니다');
}

function uploadLectExcel(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
    // 첫 행 헤더 감지 (숫자로 시작하지 않으면 헤더)
    const start=lines[0]&&/^[0-9:]/i.test(lines[0].trim())?0:1;
    const added=[];
    for(let i=start;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.replace(/^["']|["']$/g,'').trim());
      if(cols.length>=2&&cols[1]){
        added.push({
          title:cols[1]||'',
          slot:cols[0]||'',
          field:cols[2]||'',
          instructorName:cols[3]||'',
          instructorId:''
        });
      }
    }
    LECT_DRAFT=[...LECT_DRAFT,...added];
    renderLectRows();
    toast(`✅ 강의 ${added.length}개 추가됨`);
  };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}

function uploadAttExcel(e){
  const file=e.target.files[0];if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    const reader=new FileReader();
    reader.onload=ev=>{
      const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
      // 첫 행이 헤더인지 판단 (숫자 없으면 헤더)
      const start=isNaN(lines[0].split(',')[0])?1:0;
      const added=[];
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(',').map(c=>c.replace(/^["']|["']$/g,'').trim());
        if(cols.length>=3&&cols[2]){added.push({team:cols[0]||'',store:cols[1]||'',name:cols[2]});}
      }
      ATT_DRAFT=[...ATT_DRAFT,...added];
      renderAttRows();
      toast(`✅ ${added.length}명 추가됨`);
    };
    reader.readAsText(file,'UTF-8');
  } else {
    // xlsx: SheetJS CDN 없으면 CSV로 저장 안내
    toast('xlsx 파일은 CSV로 저장 후 업로드해주세요 (다른이름으로 저장 → CSV)');
  }
  e.target.value=''; // 파일 초기화
}
function saveTraining(){

  const lectures=LECT_DRAFT.filter(L=>L.title.trim()).map((L,i)=>{
    let iid=L.instructorId;
    const iname=(L.instructorName||'').trim();
    if(!iid&&iname){
      // 이름으로 기존 강사 찾기
      const existing=DB.instructors.find(x=>x.name===iname);
      if(existing){iid=existing.id;}

function dlRaw(tid){
  // 교육과정별 설문 로우데이터 (응답자 1행 기준)
  const t=byId(DB.trainings,tid);
  const rs=respOf(tid);
  if(!rs.length){toast('응답 데이터가 없습니다');return;}
  // 헤더: 기본정보 + 강의별 전문성/실무적용/좋았던점/개선점 + 과정전체
  const header=['No','제출시각','교육명','차수','교육일','유형'];
  t.lectures.forEach((L,i)=>{
    const ins=byId(DB.instructors,L.instructorId);
    const prefix=`[강의${i+1}] ${L.title}(${ins?.name||''})`;
    header.push(`${prefix} - 전문성`,`${prefix} - 실무적용`,`${prefix} - 좋았던점`,`${prefix} - 개선이필요한점`);
  });
  header.push('추천강의','추가필요콘텐츠','기타의견');
  const rows=[header];
  rs.forEach((r,idx)=>{
    const row=[idx+1, r.at.replace('T',' ').slice(0,16), t.name, t.round, t.date, t.type];
    t.lectures.forEach(L=>{
      const v=r.lect[L.id]||{};
      row.push(
        LIKERT[(v.expert||1)-1]||'',
        LIKERT[(v.practical||1)-1]||'',
        v.good||'',
        v.improve||''
      );
    });
    row.push(
      lectOf(t,r.recommendLecture)?.title||'',
      r.need||'',
      r.etc||''
    );
    rows.push(row);
  });
  csv(rows,`설문로우데이터_${t.name}_${t.round}차_${t.date}.csv`);
  toast(`설문 로우데이터 ${rs.length}건 다운로드 완료`);
}

  const rs=respOf(t.id);const a=getAI(RPQ);

  function lectOpinions(L){
    const goods=[],imps=[];
    rs.forEach(r=>{const v=r.lect[L.id];if(!v)return;
      if(v.good&&!/^없|^무$|^특이|^\.$|^\s*$/.test(v.good))goods.push(v.good);

  const needs=rs.map(r=>r.need).filter(v=>v&&!/^없/.test(v));
  const etcs=rs.map(r=>r.etc).filter(v=>v&&!/^없/.test(v));

function addPhoto(tid, idx, input){
  const file=input.files[0]; if(!file)return;
  if(file.size>3*1024*1024){toast('사진은 3MB 이하로 올려주세요');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    const t=byId(DB.trainings,tid);
    if(!t.photos)t.photos=[];
    t.photos[idx]=e.target.result;
    // Supabase 저장
    sbPatch('trainings',tid,{photos:t.photos});
    save();render();toast('사진이 추가되었습니다');
  };
  reader.readAsDataURL(file);
}
function removePhoto(tid,idx){
  const t=byId(DB.trainings,tid);
  if(!t.photos)return;
  t.photos[idx]=null;
  sbPatch('trainings',tid,{photos:t.photos});
  save();render();toast('사진이 삭제되었습니다');
}
function printReport(){document.body.classList.add('print-report');window.print();
  setTimeout(()=>document.body.classList.remove('print-report'),400);}

  $('#budgetList').innerHTML=BUDGET_DRAFT.map((b,i)=>`

    <input class="input num" style="font-size:.78rem;padding:6px 8px;text-align:right" type="number" min="0" value="${b.actual||0}"
      oninput="BUDGET_DRAFT[${i}].actual=+this.value||0" placeholder="실제">
    <input class="input" style="font-size:.78rem;padding:6px 8px" placeholder="상세 (예: 6,000원*18명)" value="${esc(b.note||'')}"
      oninput="BUDGET_DRAFT[${i}].note=this.value">
    <input class="input" style="font-size:.78rem;padding:6px 8px" placeholder="비고" value="${esc(b.remark||'')}"
      oninput="BUDGET_DRAFT[${i}].remark=this.value">
    <button class="btn sm ghost" style="padding:4px 6px" onclick="BUDGET_DRAFT.splice(${i},1);renderBudgetRows()">✕</button>
   </div>`).join('');

function saveBudget(tid){
  const t=byId(DB.trainings,tid);
  t.budget=BUDGET_DRAFT.filter(b=>b.item.trim()).map(b=>({...b}));
  save();
  sbPatch('trainings',tid,{budget:t.budget});
  closeModal();render();toast('교육 비용이 저장되었습니다');
}

function openSlideFullscreen(){
  const t=GUIDE_SEL?byId(DB.trainings,GUIDE_SEL):null;
  if(!t){toast('교육을 먼저 선택해주세요');return;}
  const attendUrl=`${location.origin||''}${location.pathname}#/attend/${GUIDE_SEL}`;
  const surveyUrl=`${location.origin||''}${location.pathname}#/s/${GUIDE_SEL}`;
  const win=window.open('','_blank','width=1280,height=720');
  const slideHtml=renderSlide(GUIDE_SLIDE,t,attendUrl,surveyUrl);
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8">
  <style>*{margin:0;padding:0;box-sizing:border-box}body{width:100vw;height:100vh;overflow:hidden;font-family:'Pretendard',sans-serif}
  #slide{width:100%;height:100%}</style></head>
  <body><div id="slide">${slideHtml}</div>
  <script>
  function drawQR(canvas,text){const n=29,s=Math.floor(Math.min(canvas.width,canvas.height)/n);canvas.width=n*s;canvas.height=n*s;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,n*s,n*s);ctx.fillStyle='#111';let x=0;for(const ch of text){x=(x*31+ch.charCodeAt(0))>>>0;}const rnd=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296;};for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(rnd()<.46)ctx.fillRect(i*s,j*s,s,s);}const F=(cx,cy)=>{ctx.fillStyle='#111';ctx.fillRect(cx,cy,7*s,7*s);ctx.fillStyle='#fff';ctx.fillRect(cx+s,cy+s,5*s,5*s);ctx.fillStyle='#111';ctx.fillRect(cx+2*s,cy+2*s,3*s,3*s);};ctx.fillStyle='#fff';ctx.fillRect(0,0,8*s,8*s);ctx.fillRect((n-8)*s,0,8*s,8*s);ctx.fillRect(0,(n-8)*s,8*s,8*s);F(0,0);F((n-7)*s,0);F(0,(n-7)*s);}
  const ca=document.getElementById('qrAttend')||document.getElementById('qrSurvey');
  if(ca)drawQR(ca,ca.id==='qrAttend'?'${attendUrl}':'${surveyUrl}');
  document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='F11')window.close();});
  <\/script></body></html>`;
  win.document.write(html);win.document.close();
}

    <textarea class="input" rows="2" oninput="SV.need=this.value">${esc(SV.need)}</textarea>
    <div class="sv-q">기타 교육관련 의견이 있으시면 자유롭게 기입하여 주세요.</div>
    <div class="card-sub" style="margin:-4px 0 6px">온라인/오프라인, 기타 교육에 대한 의견 모두 환영합니다. 여러분의 의견이 교육 개발에 큰 도움이 됩니다!</div>
    <textarea class="input" rows="3" oninput="SV.etc=this.value">${esc(SV.etc)}</textarea>
   </div>
   <button class="btn primary" style="width:100%;justify-content:center;padding:14px;font-size:1rem" onclick="submitSurvey()">제출하기</button>
   <div style="text-align:center;font-size:.75rem;color:var(--ink4);margin-top:12px">응답은 익명으로 수집되며 제출 즉시 대시보드에 반영됩니다</div>
  </div>`;
  prog();
}
function setLik(path,n){
  const [lid,f]=path.split('.');
  SV.lect[lid][f]=n;
  // 전체 재렌더 대신 버튼 상태만 업데이트
  const buttons=document.querySelectorAll(`[data-lect="${lid}"][data-field="${f}"]`);
  buttons.forEach((btn,i)=>{
    const sel=(i+1)===n;
    const COLORS=['#e05252','#e0a832','#16a34a'];
    btn.style.background=sel?COLORS[i]:'';
    btn.style.borderColor=sel?COLORS[i]:'';
    btn.style.color=sel?'#fff':'';
  });
  // 진행률 업데이트
  prog();
}
function prog(){
  const need=[...Object.values(SV.lect).flatMap(v=>[v.expert,v.practical]),SV.recommendLecture?1:0];
  const el=$('#svProg');if(el)el.style.width=Math.round(need.filter(Boolean).length/need.length*100)+'%';
}

    lect:SV.lect,recommendLecture:SV.recommendLecture,need:SV.need.trim(),etc:SV.etc.trim()};

      body:JSON.stringify({
        id:resp.id,training_id:resp.trainingId,lect:resp.lect,

async function submitAttend(tid){
  const empNo=$('#atEmpNo').value.trim();
  const name=$('#atName').value.trim();
  if(!empNo||!name){toast('사번과 성명을 모두 입력해 주세요');return;}
  const t=byId(DB.trainings,tid);
  if(!t.checkins)t.checkins=[];
  // 중복 체크
  if(t.checkins.find(c=>c.empNo===empNo)){
    toast('이미 출석 등록된 사번입니다');return;
  }
  const checkin={empNo,name,at:new Date().toISOString()};
  t.checkins.push(checkin);
  save();
  // Supabase: training checkins 업데이트
  try{
    await fetch('https://eldpjvlefuhyfacrmwsl.supabase.co/rest/v1/trainings?id=eq.'+tid,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZHBqdmxlZnVoeWZhY3Jtd3NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjMxNDIsImV4cCI6MjA5OTEzOTE0Mn0.YuG62v1942mOW-ew-cAvkMfXnEnfgW_AFGmqTt0uThM','Prefer':'return=minimal'},
      body:JSON.stringify({checkins:t.checkins})
    });
  }catch(e){console.warn('출석 저장 오류:',e);}
  $('#app').innerHTML=`<div class="survey-wrap" style="padding-top:18vh"><div class="sv-card" style="text-align:center">
   <div style="font-size:2.8rem">✅</div>
   <div class="sv-title" style="margin-top:8px">출석이 완료되었습니다</div>
   <div style="font-size:1.1rem;font-weight:800;margin-top:6px;color:var(--green)">${esc(name)}</div>

   ${session?`<button class="btn primary" style="margin-top:18px" onclick="nav('#/guide')">관리자 화면으로</button>`:''}
  </div></div>`;
}
